(function(){const tg=window.Telegram?.WebApp;try{if(tg){tg.ready();tg.expand();tg.setHeaderColor('#09090b');tg.setBackgroundColor('#09090b');if(typeof tg.requestFullscreen==='function'&&tg.isVersionAtLeast?.('8.0'))tg.requestFullscreen();}}catch(e){}const overlay=document.getElementById('overlay'),frame=document.getElementById('project'),load=document.getElementById('load'),back=document.getElementById('back');const urls={arsenal:'./showcase.html#arsenal',dashbyte:'./'};let active='';function open(id,push=true){if(!urls[id])return;active=id;overlay.classList.add('open');load.classList.remove('off');frame.src=urls[id];if(push)history.pushState({id},'',location.pathname+'#'+id);try{tg?.BackButton?.show()}catch(e){}}function close(){active='';overlay.classList.remove('open');frame.src='about:blank';history.replaceState(null,'',location.pathname);try{tg?.BackButton?.hide()}catch(e){}}document.querySelectorAll('[data-project]').forEach(x=>x.onclick=()=>open(x.dataset.project));back.onclick=close;frame.onload=()=>load.classList.add('off');try{tg?.BackButton?.onClick(close)}catch(e){}window.addEventListener('popstate',()=>{if(urls[location.hash.slice(1)])open(location.hash.slice(1),false);else close()});if(urls[location.hash.slice(1)])open(location.hash.slice(1),false)})();
