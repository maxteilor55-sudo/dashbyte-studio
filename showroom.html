</style></head><body><main id="home"><header class="top"><div class="brand">DASH<b>BYTE.</b></div><div class="tag">STUDIO / 2026</div></header><div class="eyebrow">● DIGITAL SHOWROOM</div><h1 class="title">ВЫБЕРИ<br><span>ИСТОРИЮ.</span></h1><p class="sub">Добро пожаловать в пространство проектов DashByte. Выберите проект — и откройте его прямо здесь.</p><section class="grid"><button class="tile ars" data-project="arsenal"><span class="meta">01 / КЛИЕНТСКИЙ ПРОЕКТ</span><span class="orn" aria-hidden="true"><svg viewBox="0 0 400 230" fill="none"><path d="M65 93L189 29L363 74L243 137Z" fill="#77716d" stroke="#c1aaa2" stroke-width="3"/><path d="M65 93V189L243 222V137Z" fill="#9b8070" stroke="#d6bba7" stroke-width="3"/><path d="M243 137L363 74V168L243 222Z" fill="#3b3939" stroke="#bd9c89" stroke-width="3"/><path d="M98 115L207 142V205L98 184Z" fill="#232326" stroke="#ddc5b2" stroke-width="3"/><path d="M110 138L195 158M110 156L195 176M110 174L195 194" stroke="#b29e90" stroke-width="3"/></svg></span><span class="bottom"><span><h2>АРСЕНАЛ</h2><p>Металлоконструкции · Гаражи · Навесы<br>Пермь и Пермский край</p></span><span class="arrow">↗</span></span></button><button class="tile db" data-project="dashbyte"><span class="meta">02 / САЙТ СТУДИИ</span><span class="orn db-mark" aria-hidden="true">DB</span><span class="bottom"><span><h2>DASHBYTE.</h2><p>Веб-разработка · Айдентика · Контент<br>Наш фирменный сайт</p></span><span class="arrow">↗</span></span></button></section><footer><span>● 2 ACTIVE PROJECTS</span><span>DESIGNED BY DASHBYTE © 2026</span></footer></main><section id="overlay"><button id="back" type="button">← Все проекты</button><div id="load">ОТКРЫВАЕМ ПРОЕКТ...</div><iframe id="project" title="Просмотр сайта" allow="fullscreen"></iframe></section><script>
(function(){
  'use strict';
  const tg=window.Telegram&&window.Telegram.WebApp;
  const root=document.documentElement;
  const overlay=document.getElementById('overlay');
  const frame=document.getElementById('project');
  const loader=document.getElementById('load');
  const back=document.getElementById('back');
  const urls={arsenal:'./showcase.html#arsenal',dashbyte:'./?db-glass-parity=20261029'};
  let active='';
  let needFullScreen=!!tg;
  let currentSafe=0, currentSiteY=62, loadToken=0;
  let pendingReadyCleanup=null;
  const injected=new WeakMap();
  const stabilizedStudioDocs=new WeakSet();

  // Telegram defines two independent inset types. contentSafeAreaInset covers
  // the Telegram title/close actions in full-screen mode; device-only safe-area does not.
  function updateSafeArea(){
    const a=tg&&tg.safeAreaInset||{};
    const c=tg&&tg.contentSafeAreaInset||{};
    const full=!!(tg&&(tg.isFullscreen||needFullScreen));
    const insetTop=Math.max(0,Number(a.top)||0,Number(c.top)||0);
    const insetBottom=Math.max(0,Number(a.bottom)||0,Number(c.bottom)||0);
    // On clients that omit inset values the fallback keeps the native controls clear.
    currentSafe=full?Math.max(80,insetTop+9):0;
    currentSiteY=currentSafe+58;
    root.style.setProperty('--db-telegram-top',currentSafe+'px');
    root.style.setProperty('--db-showroom-glass-top',(tg?Math.max(60,Math.min(66,currentSafe-20)):18)+'px');
    root.style.setProperty('--db-telegram-bottom',insetBottom+'px');
    root.style.setProperty('--db-project-header-top',currentSiteY+'px');
    applyToOpenedProject();
  }

  function safeStyle(doc,key,css){
    if(!doc||!doc.head)return;
    let node=doc.getElementById(key);
    if(!node){node=doc.createElement('style');node.id=key;doc.head.appendChild(node)}
    if(node.textContent!==css)node.textContent=css;
  }

  function patchArsenal(doc){
    if(!doc||!doc.querySelector('.site-header'))return;
    const headerTop=currentSafe+8;
    const css=`/* Telegram showroom adjustments to Arsenal */
      .site-header,.site-header.is-scrolled{top:${headerTop}px!important}
      html{scroll-padding-top:${headerTop+135}px!important}
      .lightbox-close{top:${currentSafe+12}px!important}
      @media(max-width:680px){.site-header,.site-header.is-scrolled{top:${headerTop}px!important}}
    `;
    safeStyle(doc,'dashbyte-tg-arsenal-safe',css);
    const header=doc.querySelector('.site-header');
    const measured=Math.max(90,Math.round(header.getBoundingClientRect().height)||0);
    // Back button is now below the glass menu, not above it.
    // #back declares top with !important. Set an important inline offset too:
    // otherwise the button stays in the header and covers the Arsenal logo.
    back.style.setProperty('top',(headerTop+measured+12)+'px','important');
    back.style.setProperty('left','17px','important');
  }

  // The studio runs in a same-origin iframe. Its own responsive styles and
  // scroll animation may rewrite inline transforms after initial load, so
  // the showroom must keep geometry in sync with Telegram's content-safe area.
  function cancelPendingReveal(){
    if(pendingReadyCleanup){
      pendingReadyCleanup();
      pendingReadyCleanup=null;
    }
  }

  function revealWhenStudioReady(){
    const token=loadToken;
    let doc;
    try{doc=frame.contentDocument}catch(e){}
    if(!doc||!doc.documentElement)return;
    // Avoid exposing about:blank while an iframe navigation is still underway.
    if(!doc.getElementById('db-entry-controller'))return;
    const root=doc.documentElement;
    const preloader=doc.getElementById('db-preloader');
    let complete=false;
    let watcher=null;
    let watchdog=null;
    function completeReveal(){
      if(complete)return;
      complete=true;
      if(watcher)watcher.disconnect();
      if(watchdog)clearTimeout(watchdog);
      if(pendingReadyCleanup===cleanup)pendingReadyCleanup=null;
      if(token===loadToken && active==='dashbyte')loader.classList.add('off');
    }
    function cleanup(){
      if(complete)return;
      complete=true;
      if(watcher)watcher.disconnect();
      if(watchdog)clearTimeout(watchdog);
    }
    function check(){
      // The standalone site has finished removing its own preload transition
      // and revealed the hero. Only now uncover the embedded iframe.
      if(root.classList.contains('db-hero-entered') ||
         (root.classList.contains('db-portfolio-route') &&
          (!preloader||preloader.classList.contains('db-loaded')))){
        completeReveal();
      }
    }
    watcher=new doc.defaultView.MutationObserver(check);
    watcher.observe(root,{attributes:true,attributeFilter:['class']});
    if(preloader)watcher.observe(preloader,{attributes:true,attributeFilter:['class']});
    watchdog=setTimeout(completeReveal,21000);
    pendingReadyCleanup=cleanup;
    check();
  }

  function stabilizeStudioNav(doc){
    if(!doc||!doc.documentElement||!doc.defaultView)return;
    const bar=doc.querySelector('#topbar,.topbar');
    if(!bar)return;
    const root=doc.documentElement;
    const win=doc.defaultView;
    // Align to the exact same Telegram safe boundary as Arsenal, in SCREEN coordinates.
    // DB's own transformed layers can shift the apparent header even when CSS top is 50px.
    let top=Number.parseFloat(root.style.getPropertyValue('--db-showroom-menu-top'));
    if(!Number.isFinite(top))top=tg?currentSafe+8:18;
    // Compare normalized CSSOM values: browsers rewrite transform units and
    // transition shorthand, which would otherwise retrigger MutationObserver forever.
    const normalized=doc.createElement('div').style;
    const pin=function(name,value){
      normalized.setProperty(name,value,'important');
      const expected=normalized.getPropertyValue(name);
      if(expected&&(bar.style.getPropertyValue(name)!==expected||
         bar.style.getPropertyPriority(name)!=='important')){
        bar.style.setProperty(name,value,'important');
      }
    };
    pin('position','fixed');
    pin('top',top+'px');
    pin('left','50%');
    pin('right','auto');
    pin('bottom','auto');
    pin('margin','0px');
    pin('width','calc(100% - 28px)');
    pin('max-width','1120px');
    pin('transform','translate3d(-50%, 0, 0)');
    pin('-webkit-transform','translate3d(-50%, 0, 0)');
    pin('translate','none');
    pin('animation','none');
    pin('transition','opacity .42s ease, visibility .42s ease');
    const scroller=doc.scrollingElement||doc.documentElement;
    const scrollY=Math.max(win.scrollY||0,scroller.scrollTop||0,doc.body?doc.body.scrollTop||0:0);
    const visible=scrollY>18;
    root.classList.toggle('db-header-visible',visible);
    pin('opacity',visible?'1':'0');
    pin('visibility',visible?'visible':'hidden');
    pin('pointer-events',visible?'auto':'none');

    // Critical: top in the iframe and actual on-screen top are not always equal
    // (composited/transformed ancestors in the studio). Measure and correct,
    // rather than applying another arbitrary CSS offset.
    const desiredScreenTop=tg?Math.max(60,Math.min(66,currentSafe-20)):18; // Immediately below Telegram controls, not the old fade band.
    const iframeTop=frame.getBoundingClientRect().top;
    const actualScreenTop=iframeTop+bar.getBoundingClientRect().top;
    const delta=desiredScreenTop-actualScreenTop;
    if(Number.isFinite(delta)&&Math.abs(delta)>1&&Math.abs(delta)<180){
      top=Math.max(-95,Math.min(310,top+delta));
      pin('top',top+'px');
      root.style.setProperty('--db-showroom-menu-top',top+'px');
    }
    const height=Math.max(72,Math.round(bar.getBoundingClientRect().height)||0);
    const sheetTop=(top+height+10)+'px';
    if(root.style.getPropertyValue('--db-showroom-sheet-top')!==sheetTop){
      root.style.setProperty('--db-showroom-sheet-top',sheetTop);
    }
    if(stabilizedStudioDocs.has(doc))return;
    stabilizedStudioDocs.add(doc);
    const sync=function(){if(active==='dashbyte')stabilizeStudioNav(doc)};
    win.addEventListener('scroll',sync,{passive:true});
    doc.addEventListener('scroll',sync,{passive:true,capture:true});
    win.addEventListener('resize',sync,{passive:true});
    // Only watch the menu itself; observing the whole document causes
    // unnecessary work on image/video-heavy pages.
    new win.MutationObserver(sync).observe(bar,{
      attributes:true,attributeFilter:['style']
    });
  }

  function patchDashByte(doc){
    // The embedded studio now owns its own glass-header animation and safe position.
    // Parent only supplies Telegram's content-safe inset and the showroom return card.
    // Position glass directly beneath native controls, using Telegram safe-area metrics.
    // No oversized fixed offset; the showroom and iframe now share one position.
    const headerTop=tg?Math.max(60,Math.min(66,currentSafe-20)):18; // align with first clean line below native Telegram chrome
    if(!doc||!doc.documentElement)return;
    doc.documentElement.classList.add('db-showroom-stage');
    doc.documentElement.style.setProperty('--db-showroom-menu-top',headerTop+'px');
    const css=/* Showroom-only layout and resilient Telegram-safe header. */`
      html.db-showroom-stage #topbar,html.db-showroom-stage .topbar{
        position:fixed!important;
        top:var(--db-showroom-menu-top,88px)!important;
        /* Match Arsenal's quiet smoked Liquid Glass, not solid crimson. */
        background:linear-gradient(123deg,rgba(71,70,71,.83),rgba(49,50,52,.79) 54%,rgba(44,45,47,.84))!important;
        background-color:transparent!important;
        border:1px solid rgba(255,255,255,.30)!important;
        border-radius:32px!important;
        box-shadow:0 15px 43px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.14)!important;
        backdrop-filter:blur(27px) saturate(122%)!important;
        -webkit-backdrop-filter:blur(27px) saturate(122%)!important;
        left:50%!important;right:auto!important;bottom:auto!important;
        width:calc(100% - 28px)!important;max-width:1120px!important;
        margin:0!important;translate:none!important;
        transform:translate3d(-50%,0,0)!important;
        -webkit-transform:translate3d(-50%,0,0)!important;
        animation:none!important;-webkit-animation:none!important;
        transition:opacity .42s ease,visibility .42s ease!important;
      }
      html.db-showroom-stage:not(.db-header-visible) #topbar,
      html.db-showroom-stage:not(.db-header-visible) .topbar{
        opacity:0!important;visibility:hidden!important;pointer-events:none!important;
      }
      html.db-showroom-stage.db-header-visible #topbar,
      html.db-showroom-stage.db-header-visible .topbar{
        opacity:1!important;visibility:visible!important;pointer-events:auto!important;
      }
      html.db-showroom-stage #menu-sheet,html.db-showroom-stage .menu-sheet{
        top:var(--db-showroom-sheet-top,330px)!important;
        max-height:max(110px,calc(100dvh - var(--db-showroom-sheet-top,330px) - 12px))!important;
        overflow-y:auto!important;
      }
      html.db-showroom-stage{scroll-padding-top:calc(var(--db-showroom-menu-top,84px) + 120px)}
      @media(prefers-reduced-motion:reduce){html.db-showroom-stage #topbar,html.db-showroom-stage .topbar{transition:none!important}}
      /* Keep only the brand's masked backdrop blur on both viewport edges.
         Remove tint gradients; preserve the existing blur and feather mask. */
      html.db-showroom-stage .edge-fog.fog-top,
      html.db-showroom-stage .edge-fog.fog-bottom{
        background:transparent!important;
        background-image:none!important;
      }
      /* Portfolio return card styling. */
      .db-showroom-return{position:relative;isolation:isolate;display:block;overflow:hidden;
        margin:clamp(38px,7vw,90px) auto 28px;padding:clamp(26px,5vw,54px);
        max-width:1180px;border:1px solid rgba(255,255,255,.2);border-radius:32px;
        background:radial-gradient(ellipse at 95% 5%,rgba(239,42,78,.3),transparent 56%),
        linear-gradient(135deg,#211720,#0a0a0e);box-shadow:0 30px 95px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.09);
        color:#f7f6f8;text-align:left;box-sizing:border-box}
      .db-showroom-return:after{content:'DB';position:absolute;right:-2%;bottom:-20%;z-index:-1;
        font:900 clamp(160px,36vw,420px)/.9 Arial,sans-serif;letter-spacing:-.14em;
        -webkit-text-stroke:1px rgba(255,255,255,.13);color:transparent;transform:rotate(-12deg);pointer-events:none}
      .db-showroom-return small{display:block;margin-bottom:21px;color:#fb687c;font:700 11px/1.4 Arial,sans-serif;letter-spacing:.22em}
      .db-showroom-return h2{margin:0 0 17px;font:850 clamp(30px,6vw,65px)/.99 Arial,sans-serif;letter-spacing:-.065em;text-transform:uppercase;color:white}
      .db-showroom-return h2 span{color:#f23c57}
      .db-showroom-return p{max-width:470px;margin:0 0 27px;color:#d4c5cb;font:400 clamp(15px,2vw,19px)/1.65 Arial,sans-serif}
      .db-showroom-return button{display:inline-flex;align-items:center;justify-content:space-between;gap:25px;
        min-height:61px;max-width:100%;padding:17px 22px;border:1px solid rgba(255,255,255,.34);
        border-radius:18px;background:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(18px);
        -webkit-backdrop-filter:blur(18px);font:700 15px/1.3 Arial,sans-serif;cursor:pointer;
        transition:background .2s,transform .2s}
      .db-showroom-return button:active{transform:scale(.985)}
      .db-showroom-return button:hover{background:rgba(242,60,87,.25)}
      @media(max-width:650px){.db-showroom-return{margin:38px 15px 25px;padding:28px 24px;border-radius:25px}
        .db-showroom-return button{width:100%}}
    `;
    safeStyle(doc,'dashbyte-tg-studio-safe',css);
    stabilizeStudioNav(doc);
    addShowroomReturn(doc);
  }

  function addShowroomReturn(doc){
    if(!doc||!doc.body||doc.getElementById('db-showroom-return'))return;
    const sections=Array.from(doc.querySelectorAll('section,[id],article'));
    let target=sections.find(el=>el.id&&/^(portfolio|works|work|projects|cases|case-studies)$/i.test(el.id));
    if(!target)target=sections.find(el=>el.className&&typeof el.className==='string'&&/(^|\s)(portfolio|works|projects|cases)(\s|$)/i.test(el.className));
    const headings=Array.from(doc.querySelectorAll('h1,h2,h3,h4'));
    if(!target){
      const head=headings.find(h=>/портфолио|наши работы|кейсы|проекты|избранные работы/i.test(h.textContent||''));
      if(head)target=head.closest('section')||head.parentElement;
    }
    if(!target)target=doc.querySelector('main')||doc.body;
    const card=doc.createElement('aside');
    card.id='db-showroom-return';
    card.className='db-showroom-return';
    card.setAttribute('aria-label','Вернуться к выбору проектов DashByte');
    card.innerHTML='<small>● DASHBYTE / DIGITAL SHOWROOM</small>'+
      '<h2>ЕЩЁ ОДНА<br><span>ИСТОРИЯ.</span></h2>'+
      '<p>Каждый проект — отдельный мир. Вернись в шоурум и выбери, что посмотреть дальше.</p>'+
      '<button type="button"><span>← &nbsp; Выбрать другую историю</span> <span aria-hidden="true">↗</span></button>';
    // This event listener runs in the showroom's JS context, so it closes the parent overlay directly.
    card.querySelector('button').addEventListener('click',function(){closeProject(true)});
    if(target===doc.body||target.tagName==='MAIN')target.appendChild(card);
    else target.appendChild(card);
  }

  function patchShowcase(doc){
    if(!doc)return;
    safeStyle(doc,'dashbyte-tg-single-back',
      '.viewer>.back{display:none!important;visibility:hidden!important;pointer-events:none!important;}');
    const inner=doc.getElementById('arsenal');
    if(inner){
      if(!injected.has(inner)){
        inner.addEventListener('load',function(){try{patchArsenal(inner.contentDocument)}catch(e){}});
        injected.set(inner,true);
      }
      try{patchArsenal(inner.contentDocument)}catch(e){}
    }
  }

  function applyToOpenedProject(){
    if(!active)return;
    try{
      const expected=new URL(urls[active],location.href);
      const current=frame.contentWindow.location;
      // Do not patch the previously displayed project while the new iframe
      // navigation has not completed.
      if(current.origin!==expected.origin||current.pathname!==expected.pathname)return;
      const doc=frame.contentDocument;
      if(active==='arsenal')patchShowcase(doc);
      if(active==='dashbyte')patchDashByte(doc);
    }catch(e){
      // Local deployments on separate domains cannot be styled cross-origin.
    }
  }

  function openProject(id,addHistory){
    if(!urls[id])return;
    const changed=active!==id;
    active=id;
    if(changed){
      cancelPendingReveal();
      loadToken++;
      // Cover the previous frame before navigation, preventing intermediate
      // interfaces or native site preloaders from flashing into view.
      loader.textContent=id==='dashbyte'?'ГОТОВИМ DASHBYTE...':'ОТКРЫВАЕМ ПРОЕКТ...';
      loader.classList.remove('off');
      frame.name=id==='dashbyte'?'dashbyte-showroom-stage':'dashbyte-showroom-arsenal';
      frame.src=urls[id];
    }
    overlay.classList.add('open');
    overlay.dataset.project=id;
    back.style.top='';
    back.style.left='';
    document.body.style.overflow='hidden';
    document.title=(id==='arsenal'?'Арсенал':'DashByte')+' · DashByte Showroom';
    if(addHistory)history.pushState({project:id},'',location.pathname+location.search+'#'+id);
    try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light')}catch(e){}
    // One explicit in-app back button, not two overlays or a duplicate native button.
    try{tg&&tg.BackButton&&tg.BackButton.hide()}catch(e){}
    applyToOpenedProject();
  }

  function closeProject(updateHistory){
    if(!active)return;
    active='';
    loadToken++;
    cancelPendingReveal();
    overlay.classList.remove('open');
    overlay.removeAttribute('data-project');
    back.style.top='';
    back.style.left='';
    document.body.style.overflow='';
    document.title='DashByte — Showroom';
    // Keep the iframe in memory: returning to the work page is instantaneous.
    if(updateHistory)history.replaceState(null,'',location.pathname+location.search);
    try{tg&&tg.BackButton&&tg.BackButton.hide()}catch(e){}
  }

  frame.addEventListener('load',function(){
    if(!active)return;
    applyToOpenedProject();
    if(active==='dashbyte'){
      cancelPendingReveal();
      revealWhenStudioReady();
    }else{
      loader.classList.add('off');
    }
  });
  document.querySelectorAll('[data-project]').forEach(function(button){
    button.addEventListener('click',function(){openProject(button.dataset.project,true)})
  });
  back.addEventListener('click',function(){closeProject(true)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeProject(true)});
  window.addEventListener('popstate',function(){
    const id=location.hash.slice(1);
    if(urls[id])openProject(id,false);else closeProject(false);
  });

  if(tg){
    try{
      tg.ready();tg.expand();tg.setHeaderColor('#09090b');tg.setBackgroundColor('#09090b');
      if(tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')&&typeof tg.requestFullscreen==='function'){
        tg.requestFullscreen();
      }else needFullScreen=false;
      ['fullscreenChanged','safeAreaChanged','contentSafeAreaChanged','viewportChanged'].forEach(function(event){
        tg.onEvent(event,updateSafeArea);
      });
    }catch(e){}
  }
  updateSafeArea();
  window.addEventListener('resize',updateSafeArea,{passive:true});
  if(urls[location.hash.slice(1)])openProject(location.hash.slice(1),false);
})();
</script></body></html>
