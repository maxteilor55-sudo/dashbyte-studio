</style></head><body><div id="app"></div><script>
(function(){
'use strict';
var KEY='round_zero_mma_world_v1';
var names=['Артём Громов','Илья Ветров','Данил Шарипов','Рустам Ганиев','Никита Березин','Руслан Якупов','Азамат Ахметов','Тимур Левин','Матвей Серов','Александр Титов','Марат Юсупов','Денис Корнеев','Михаил Савин','Игорь Трошин','Богдан Исаев','Эмиль Рахимов','Назар Семёнов','Владислав Жуков','Артур Волков','Егор Калинин','Роман Сафин','Савелий Миронов','Андрей Котов','Давид Ким','Сергей Оганесян','Юрий Беляев','Арсен Михайлов','Влад Мирзаев'];
var cities=['Пермь','Кунгур','Екатеринбург','Тюмень','Уфа','Казань','Челябинск','Ижевск','Москва','Санкт-Петербург','Краснодар','Самара'];
var weights=[{id:70,name:'Лёгкий',limit:'70 кг'},{id:77,name:'Полусредний',limit:'77 кг'},{id:84,name:'Средний',limit:'84 кг'}];
var ui={tab:'hub',select:0,role:'coach',name:'Максим',train:'striking',fight:null,modal:null,toast:null,drawTimer:0};
var s=null;var ID=0;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[rand(0,a.length-1)]}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function cash(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function id(){return ++ID}function pct(n){return clamp(Math.round(n),0,100)+'%'}
function weight(w){return weights.find(function(x){return x.id===w})||weights[0]}
function statsScore(f){return Math.round((f.striking+f.grappling+f.defense+f.cardio)/4)}
function makeF(name,city,w,level){return {id:id(),name:name,city:city,weight:w,age:rand(19,31),striking:clamp(level+rand(-8,9),35,98),grappling:clamp(level+rand(-10,10),35,98),defense:clamp(level+rand(-9,9),35,98),cardio:clamp(level+rand(-8,9),35,98),wins:rand(0,3),losses:rand(0,2),fans:rand(120,900),energy:100,injury:0,form:50,morale:72,hype:rand(10,30),lastFight:0}}
function save(){if(!s)return;try{localStorage.setItem(KEY,JSON.stringify({game:s,seq:ID}))}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.game&&o.game.version===1){s=o.game;ID=o.seq||100;return}}catch(e){}s=null}
function base(role,name){var w=[];for(var i=0;i<27;i++){w.push(makeF(names[i],cities[i%cities.length],weights[i%3].id,rand(51,78)))}var roster=role==='coach'?[makeF('Артём Волков','Пермь',70,62),makeF('Руслан Исаев','Пермь',77,58),makeF('Илья Орлов','Кунгур',84,56)]:[makeF(name==='Максим'?'Максим Собянин':name,'Пермь',70,60)];
roster.forEach(function(f){f.wins=0;f.losses=0;f.fans=role==='fighter'?360:rand(120,240);f.form=55});
return {version:1,role:role,player:name,week:1,money:role==='coach'?115000:38000,rep:8,club:'СТАЛЬ · Пермь',fans:220,trainingLeft:3,roster:roster,world:w,fac:{gym:1,physio:1,media:1},pending:null,feed:[],history:[],offers:0,selectedId:roster[0].id}}
function addFeed(kind,title,body,fans,comments){if(!s)return;var standard=comments||[pick(['Пермь в деле!','Ну-ка посмотрим, что дальше.','Есть потенциал, но работать надо.','Посмотрим на серьёзных соперников.']),pick(['Уважение за характер!','Вот это уже интересно.','Хайпа многовато, на мой взгляд.'])];s.feed.unshift({id:id(),kind:kind,week:s.week,title:title,body:body,views:Math.max(130,Math.round(fans*(rand(4,13)+s.fac.media))),likes:rand(25,150),comments:standard});s.feed=s.feed.slice(0,45)}
function newGame(){var v=document.getElementById('playerName');ui.name=(v&&v.value||'Максим').trim().slice(0,18)||'Максим';s=base(ui.role,ui.name);addFeed('СТАРТ','В Перми появился новый проект в мире ММА','Клуб «СТАЛЬ» объявил о начале работы. За первыми боями будут следить местные спортивные сообщества.',250,['Будем следить.','В городе давно нужен такой зал!']);save();ui.tab='hub';render()}
function selected(){return s.roster.find(function(f){return f.id===s.selectedId})||s.roster[0]}
function competitor(oid){return s.world.find(function(f){return f.id===oid})}
function modeName(){return s.role==='coach'?'УПРАВЛЕНИЕ КЛУБОМ':'КАРЬЕРА БОЙЦА'}
function setToast(t){ui.toast=t;render();setTimeout(function(){ui.toast=null;var el=document.querySelector('.toast');if(el)el.remove()},2400)}
function cap(x){return x.charAt(0).toUpperCase()+x.slice(1)}
function top(){return '<header class="top"><div class="brand">ROUND <b>ZERO</b><small>MMA WORLD · ALPHA 0.1</small></div><div class="money"><small>Бюджет · нед. '+s.week+'</small><strong>'+cash(s.money)+'</strong></div></header>'}
function nav(){var tabs=[['hub','⌂','Главная'],['roster','♟','Бойцы'],['train','✚','Зал'],['events','⬡','Турниры'],['feed','▤','СМИ']];return '<nav class="nav">'+tabs.map(function(t){return '<button data-nav="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join('')+'</nav>'}
function header(text,sub){return '<div class="caps">'+esc(sub||modeName())+'</div><div class="sp8"></div><h1>'+text+'</h1><div class="sp18"></div>'}
function avatar(f,big){return '<div class="avatar '+(big?'l':'')+'">'+esc(f.name.split(' ').map(function(x){return x[0]}).slice(0,2).join(''))+'</div>'}
function fighterCard(f,on){return '<div class="fighter-card '+(on?'selected':'')+'" data-fighter="'+f.id+'">'+avatar(f)+'<div class="fill"><div class="fighter-name">'+esc(f.name)+'</div><div class="fighter-meta">'+weight(f.weight).name+' · '+f.wins+'–'+f.losses+' · '+f.age+' лет</div><div class="bar green"><div style="width:'+pct(f.form)+'"></div></div></div><div style="text-align:right"><b class="gold">'+statsScore(f)+'</b><div class="tiny muted">рейтинг</div></div></div>'}
function hub(){var f=selected();var pending=s.pending;return '<main class="page"><section class="hero"><div class="hero-content"><div class="kicker">ПЕРМСКИЙ КРАЙ · НЕДЕЛЯ '+s.week+'</div><h1>ЗДЕСЬ<br>РОЖДАЮТСЯ<br>ЧЕМПИОНЫ.</h1><p>Каждое решение меняет карьеру, клуб и спортивный мир.</p><div class="sp12"></div><span class="pill gold">● '+(s.role==='coach'?'Главный тренер':'Профессиональный боец')+'</span></div></section><div class="sp12"></div><div class="grid3"><div class="stat"><strong>'+s.rep+'</strong><small>Репутация</small></div><div class="stat"><strong>'+s.roster.length+'</strong><small>Бойцы</small></div><div class="stat"><strong>'+s.fans.toLocaleString('ru-RU')+'</strong><small>Фанаты</small></div></div><div class="section-head"><h3>'+(pending?'Ближайший бой':'Следующий шаг')+'</h3><span class="pill">Осталось действий: '+s.trainingLeft+'</span></div>'+
(pending?'<div class="panel"><div class="caps">КАРД · '+(pending.weeksLeft>0?'ЧЕРЕЗ '+pending.weeksLeft+' НЕД.':'БОЙ ГОТОВ')+'</div><div class="sp8"></div><h2>'+esc(s.roster.find(function(x){return x.id===pending.fid}).name)+' <span class="red">VS</span> '+esc(competitor(pending.oid).name)+'</h2><div class="sp12"></div><button class="btn main block" data-action="'+(pending.weeksLeft>0?'advance':'startFight')+'">'+(pending.weeksLeft>0?'⏭ Продолжить подготовку':'🥊 ВЫЙТИ НА БОЙ')+'</button></div>':'<div class="panel"><h3>Выбери бой и подготовь спортсмена</h3><p class="muted small" style="line-height:1.6;margin:9px 0">Соперники растут вместе с тобой. У побед есть последствия, у поражений — тоже.</p><button class="btn main block" data-nav="events">Выбрать турнир ↗</button></div>')+
'<div class="section-head"><h3>'+(s.role==='coach'?'Твои воспитанники':'Твой боец')+'</h3><button class="btn outline mini" data-nav="roster">Подробнее →</button></div>'+s.roster.slice(0,3).map(function(x){return fighterCard(x,x.id===f.id)}).join('')+

function training(){var f=selected(),t=trainingTypes.find(function(x){return x.key===ui.train})||trainingTypes[0];if(s.trainingLeft<=0)return setToast('На этой неделе больше нет тренировок');if(s.money<t.price)return setToast('Недостаточно денег');if(f.injury>55)return setToast('Сначала восстанови травмированного бойца');

function fightBar(value){return '<div class="health"><div style="width:'+pct(value)+'"></div></div>'}
function fightUI(){var g=ui.fight,p=s.pending,f=s.roster.find(function(x){return x.id===g.fid}),o=competitor(g.oid);
return '<div class="fight-overlay"><div class="fight-shell"><div class="fight-top"><div><div class="caps">URAL FIGHT NIGHTS</div><div class="tiny muted">'+esc(p.city)+' · '+(g.isHome?'ДОМАШНЯЯ АРЕНА':'ВЫЕЗДНОЙ БОЙ')+'</div></div><span class="pill gold">ЗРИТЕЛИ: '+(Math.round(480+s.rep*14+p.hype*13+(g.isHome?s.fans*.28:0))).toLocaleString('ru-RU')+'</span></div><div class="fightstats"><div><div class="strong small">'+esc(f.name.split(' ')[0])+'</div>'+fightBar(g.pHp)+'<div class="stamina"><div style="width:'+pct(g.pSta)+'"></div></div></div><div class="round">'+g.round+' / 3<small>'+Math.floor(g.time/60)+':'+String(g.time%60).padStart(2,'0')+'</small></div><div><div class="strong small">'+esc(o.name.split(' ')[0])+'</div>'+fightBar(g.oHp)+'<div class="stamina"><div style="width:'+pct(g.oSta)+'"></div></div></div></div><canvas id="fightCanvas" width="720" height="406" aria-label="Анимированная 2D-арена смешанных единоборств"></canvas><div class="ticker">'+esc(g.log)+'</div>'+(g.over?'<div class="panel" style="text-align:center"><div class="caps">'+(g.winner==='p'?'ПОБЕДА':'ПОРАЖЕНИЕ')+'</div><div class="sp12"></div><div class="score">'+esc(g.method)+'</div><div class="sp8"></div><p class="small muted">'+esc(g.winner==='p'?f.name:o.name)+' побеждает · раунд '+g.round+'</p><div class="sp18"></div><button class="btn main block big" data-action="finishFight">ВЕРНУТЬСЯ В КАРЬЕРУ →</button></div>':'<div class="flex between" style="margin:12px 0"><b class="small">'+(s.role==='coach'?'КОМАНДА ИЗ УГЛА':'ВЫБЕРИ ДЕЙСТВИЕ')+'</b><span class="pill">'+(g.pos==='stand'?'СТОЙКА':'ПАРТЕР')+'</span></div><div class="actions">'+fightActions(g).map(function(x){return '<button class="btn '+(x[0]==='combo'||x[0]==='ground'?'main':'outline')+'" data-move="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="sp12"></div><button class="btn outline block mini" data-action="abandonFight">Покинуть бой (поражение)</button>')+'</div></div>'}
function fightActions(g){return g.pos==='stand'?(s.role==='coach'?[['combo','🥊 Давить в стойке'],['kick','⚡ Работать ногами'],['takedown','◈ Искать перевод'],['guard','⬡ Контратаковать']]:[['combo','🥊 Комбинация'],['kick','⚡ Удар ногой'],['takedown','◈ Перевод'],['guard','⬡ Защита']]):[['ground','👊 Граунд-энд-паунд'],['submit','⛓ Сабмишен'],['stand','↥ Подняться'],['guard','⬡ Защита в партере']]}
function move(action){var g=ui.fight;if(!g||g.over)return;var f=s.roster.find(function(x){return x.id===g.fid}),o=competitor(g.oid);g.turn++;g.step++;g.time=Math.max(0,300-g.step*43);var stFactor=g.pSta/100;var ai=pick(g.pos==='stand'?['combo','combo','kick','takedown','guard']:['ground','ground','submit','guard']);var text='',pd=0,od=0;
if(action==='guard'){g.pSta=clamp(g.pSta+rand(7,16),0,100);g.pHp=clamp(g.pHp+2,0,100);text='Хорошая защита! '+f.name+' считывает атаки соперника.'}
else if(action==='takedown'){var succ=clamp(.43+(f.grappling-o.defense)*.011+(g.pSta-g.oSta)*.002,.12,.82);g.pSta-=11;if(Math.random()<succ){g.pos='ground';g.pointsP+=9;od=rand(2,7);text=f.name+' проводит успешный тейкдаун! Бой переходит в партер.'}else{text=o.name+' защищает проход в ноги!';g.pointsO+=4}}
else if(action==='stand'){g.pSta-=7;if(Math.random()<.7+(f.grappling-o.grappling)*.006){g.pos='stand';text=f.name+' поднимается из партера.'}else{text=o.name+' удерживает позицию.'}}
else if(action==='submit'){g.pSta-=18;var succ2=clamp(.07+(f.grappling-o.grappling)*.009+(100-g.oSta)*.002,.015,.53);if(Math.random()<succ2){g.over=true;g.winner='p';g.method='SUBMISSION';text=f.name+' ловит соперника на приём! '+o.name+' сдаётся!'}else{g.pointsP+=3;text='Попытка удушения! '+o.name+' вырывается.'}}
else{var attackSkill=action==='ground'?f.grappling:f.striking;var defense=o.defense;var hit=Math.random()<clamp(.72+(attackSkill-defense)*.005,.35,.91);g.pSta=clamp(g.pSta-(action==='kick'?17:action==='ground'?12:13),0,100);if(hit){od=Math.max(1,Math.round((action==='kick'?rand(10,20):action==='ground'?rand(7,15):rand(7,16))*(.6+attackSkill/120)*(.38+stFactor*.62)));g.pointsP+=od;g.oSta=clamp(g.oSta-rand(4,9),0,100);text=(action==='kick'?'Мощный удар ногой! ':action==='ground'?'Серия ударов сверху! ':'Комбинация попадает в цель! ')+o.name+' получает урон.'}else{text=o.name+' уходит от атаки.'}}
g.oHp=clamp(g.oHp-od,0,100);g.anim=action;
if(!g.over){if(ai==='guard'){g.oSta=clamp(g.oSta+12,0,100);text+=' Соперник выжидает.'}else if(ai==='takedown'&&g.pos==='stand'){g.oSta-=9;if(Math.random()<clamp(.4+(o.grappling-f.defense)*.009,.16,.73)){g.pos='ground';g.pointsO+=8;text+=' '+o.name+' переводит бой вниз!'}else{text+=' '+f.name+' защищает перевод.'}}else if(ai==='submit'&&g.pos==='ground'){g.oSta-=13;if(Math.random()<clamp(.055+(o.grappling-f.grappling)*.009+(100-g.pSta)*.001,.01,.38)){g.over=true;g.winner='o';g.method='SUBMISSION';text+=' '+o.name+' проводит удушение! '+f.name+' сдаётся.'}else{text+=' Попытка болевого не прошла.'}}else {var ahit=Math.random()<clamp(.7+(o.striking-f.defense)*.006,.31,.86)*(action==='guard'?.42:1);if(ahit){pd=Math.max(1,Math.round(rand(7,18)*(.55+o.striking/125)*(g.oSta<35?.62:1)));g.pointsO+=pd;g.pSta=clamp(g.pSta-rand(3,8),0,100);text+=' Ответ соперника достигает цели.'}else{text+=' Ответная атака проходит мимо.'}g.oSta=clamp(g.oSta-rand(6,12),0,100)}}
g.pHp=clamp(g.pHp-pd,0,100);g.pSta=clamp(g.pSta,0,100);g.oSta=clamp(g.oSta,0,100);
if(!g.over&&g.oHp<=0){g.over=true;g.winner='p';g.method='KO / TKO';text='Рефери останавливает бой! '+f.name+' побеждает нокаутом!'}
if(!g.over&&g.pHp<=0){g.over=true;g.winner='o';g.method='KO / TKO';text='Рефери вмешивается. '+o.name+' победил досрочно.'}
if(!g.over&&g.step>=7){if(g.round>=3){g.over=true;g.winner=(g.pointsP+rand(-7,7)>=g.pointsO?'p':'o');g.method='РЕШЕНИЕ СУДЕЙ';text='Три раунда позади. Судьи отдают победу: '+(g.winner==='p'?f.name:o.name)+'.'}else{g.round++;g.step=0;g.time=300;g.pos='stand';g.pSta=clamp(g.pSta+19,0,100);g.oSta=clamp(g.oSta+19,0,100);text+=' Гонг! Команды дают указания. Начинается раунд '+g.round+'.'}}
g.log=text;render();if(navigator.vibrate)try{navigator.vibrate(g.over?80:12)}catch(e){}
}
function finishFight(){var g=ui.fight;if(!g||!g.over)return;var f=s.roster.find(function(x){return x.id===g.fid}),o=competitor(g.oid),win=g.winner==='p',p=s.pending;win?(f.wins++,o.losses++):(f.losses++,o.wins++);f.lastFight=s.week;f.form=clamp(f.form-28,0,100);f.energy=clamp(f.energy-25,0,100);f.injury=clamp(f.injury+Math.round((100-g.pHp)*.28),0,100);f.morale=clamp(f.morale+(win?11:-14),0,100);f.striking=clamp(f.striking+rand(0,2),0,99);f.grappling=clamp(f.grappling+rand(0,2),0,99);var reward=win?p.purse:Math.round(p.purse*.35);s.money+=reward;s.rep=clamp(s.rep+(win?rand(3,7):-1),0,100);var fandom=win?rand(80,220)+Math.round(p.hype*3):rand(-60,30);f.fans=Math.max(0,f.fans+fandom);s.fans=Math.max(0,s.fans+fandom);o.fans+=win?0:100;s.history.unshift({fighter:f.name,opp:o.name,win:win,method:g.method,week:s.week});var reacts=win?[pick(['Вот это наша Пермь!','Наконец-то достойный боец!','А я говорил, что он победит!']),pick(['Хороший финиш, но до титула ещё далеко.','Уже разлетается по местным каналам!'])]:[pick(['Не вешай нос, возвращайся сильнее.','Работать над защитой надо.']),pick(['Соперник был готов лучше.','Реванш обязателен.'])];addFeed('ХАЙЛАЙТ',win?f.name+' побеждает '+o.name:o.name+' остановил '+f.name, 'Бой в '+p.city+': '+g.method+'. '+(win?'Местная публика встречает победителя овацией.':'Команда объявляет, что спортсмен вернётся в зал для работы над ошибками.'),f.fans+o.fans+800,reacts);s.pending=null;ui.fight=null;ui.tab='feed';save();setToast((win?'Победа! ':'Поражение. ')+'Гонорар '+cash(reward))}
function leaveFight(){if(!ui.fight)return;ui.fight.over=true;ui.fight.winner='o';ui.fight.method='ТЕХНИЧЕСКОЕ ПОРАЖЕНИЕ';ui.fight.log='Поединок завершён отказом от продолжения.';render()}
function reset(){ui.modal='<div class="caps">НОВАЯ КАРЬЕРА</div><h2 style="margin-top:10px">Удалить сохранение?</h2><p>Текущий клуб, бойцы, деньги и вся история будут потеряны на этом устройстве.</p><div class="sp18"></div><div class="grid2"><button class="btn outline" data-action="cancelModal">Отмена</button><button class="btn main" data-action="confirmReset">Начать заново</button></div>';render()}
function canvasDraw(){var c=document.getElementById('fightCanvas');if(!c||!ui.fight)return;var ctx=c.getContext('2d');if(!ctx)return;var g=ui.fight,w=c.width,h=c.height,t=Date.now()/420;ctx.clearRect(0,0,w,h);var bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0b0d15');bg.addColorStop(1,'#31313a');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
for(var k=0;k<4;k++){var x=[110,250,480,620][k];var spot=ctx.createRadialGradient(x,10,4,x,100,230);spot.addColorStop(0,'#f4e5cf37');spot.addColorStop(1,'#ffffff00');ctx.fillStyle=spot;ctx.fillRect(0,0,w,h)}
var attendance=clamp((s.fans+s.rep*50)/6000,.15,1);for(var n=0;n<140*attendance;n++){ctx.fillStyle=n%3?'#77727b55':'#e4cfaa55';ctx.fillRect((n*89)%w,58+(n*47)%98,4+(n%3),4)}
ctx.strokeStyle='#85879135';ctx.lineWidth=2;for(var a=0;a<12;a++){var xx=a*w/11;ctx.beginPath();ctx.moveTo(xx,32);ctx.lineTo(xx,305);ctx.stroke()}for(var yy=58;yy<300;yy+=23){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}
ctx.fillStyle='#31343c';ctx.beginPath();ctx.moveTo(96,231);ctx.lineTo(624,231);ctx.lineTo(718,363);ctx.lineTo(8,363);ctx.closePath();ctx.fill();ctx.strokeStyle='#9b8d84';ctx.lineWidth=11;ctx.stroke();
ctx.fillStyle='#ffffff13';ctx.font='bold 49px Arial';ctx.textAlign='center';ctx.save();ctx.translate(360,310);ctx.scale(1,.54);ctx.fillText('ROUND ZERO',0,0);ctx.restore();
function dude(x,color,face,flip){var bounce=Math.sin(t+(flip?2:0))*4;var y=228+bounce;ctx.save();ctx.translate(x,y);ctx.scale(flip?-1:1,1);ctx.lineCap='round';ctx.strokeStyle='#06080c';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(0,69);ctx.lineTo(-24,139);ctx.moveTo(0,69);ctx.lineTo(24,140);ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=21;ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(0,74);ctx.stroke();ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(-3,-30,22,26,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#131317';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-5,-49);ctx.lineTo(7,-49);ctx.stroke();ctx.strokeStyle=face;ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-2,3);ctx.lineTo(28,26);ctx.lineTo(45,-9+(g.anim==='combo'&&!flip?-20:0));ctx.moveTo(-3,5);ctx.lineTo(-22,24);ctx.lineTo(-30,-7+(g.anim==='kick'&&!flip?-13:0));ctx.stroke();ctx.fillStyle='#10131a';ctx.beginPath();ctx.arc(45,-9+(g.anim==='combo'&&!flip?-20:0),12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-30,-7+(g.anim==='kick'&&!flip?-13:0),12,0,Math.PI*2);ctx.fill();ctx.restore()}
var gap=g.pos==='ground'?52:150;dude(360-gap,'#a93f44','#d0a687',false);dude(360+gap,'#586d88','#b48c78',true);
ctx.fillStyle='#e7d0ab';ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.fillText(g.pos==='stand'?'СТОЙКА':'ПАРТЕР',16,27);ctx.fillStyle='#e3e4e8aa';ctx.font='13px Arial';ctx.fillText('РУНДА '+g.round+'  •  '+(g.isHome?'ПЕРМЬ ЗА СВОИХ':'ВЫЕЗДНОЙ ПОЕДИНОК'),16,50);
}
function showFight(){document.body.style.overflow='hidden';document.getElementById('app').insertAdjacentHTML('beforeend',fightUI());canvasDraw()}
function clickHandler(e){var b=e.target.closest('[data-action],[data-nav],[data-fighter],[data-role],[data-train-select],[data-upgrade],[data-recruit],[data-schedule],[data-move]');if(!b)return;
if(b.dataset.nav){if(ui.fight)return;ui.tab=b.dataset.nav;render();return}
if(b.dataset.fighter){s.selectedId=+b.dataset.fighter;save();render();return}
if(b.dataset.role){ui.role=b.dataset.role;var input=document.getElementById('playerName');if(input)ui.name=input.value;render();return}
if(b.dataset.trainSelect){ui.train=b.dataset.trainSelect;render();return}
if(b.dataset.upgrade){upgrade(b.dataset.upgrade);return}
if(b.dataset.recruit){recruit(+b.dataset.recruit);return}
if(b.dataset.schedule){schedule(+b.dataset.schedule);return}
if(b.dataset.move){move(b.dataset.move);return}
switch(b.dataset.action){case'newGame':newGame();break;case'train':training();break;case'rest':recover();break;case'promote':promote();break;case'advance':nextWeek();break;case'startFight':fightStart();break;case'finishFight':finishFight();break;case'abandonFight':leaveFight();break;case'reset':reset();break;case'cancelModal':ui.modal=null;render();break;case'confirmReset':localStorage.removeItem(KEY);s=null;ui.modal=null;ui.fight=null;ui.tab='hub';render();break}}
function setup(){load();var root=document.getElementById('app');root.addEventListener('click',clickHandler);try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}}catch(e){}render();setInterval(function(){if(ui.fight&&document.getElementById('fightCanvas'))canvasDraw()},120)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
})();
</script></body></html>
