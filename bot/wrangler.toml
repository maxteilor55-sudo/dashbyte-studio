name = "dashbyte-studio-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

# Public URL. This currently opens the Arsenal website, as requested.
# Sensitive values belong only in Cloudflare Worker secrets:
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET

# One additional secret needed for automatic lead delivery:
# TELEGRAM_OWNER_CHAT_ID — private numeric chat ID (send /myid to bot)
# Both this and TELEGRAM_BOT_TOKEN must be configured in deployed Worker,
# not in this public TOML / GitHub Pages JavaScript.
# Optional Cloudflare Rate Limiting binding: LEAD_RATE_LIMITER.
