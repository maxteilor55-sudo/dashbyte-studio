name: Mobile smoke test — DashByte and Arsenal showroom
# Validate enlarged native Telegram clearance on actual generated HTML.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - showroom.html
      - dashbyte.html
      - arsenal.html
      - .github/workflows/showroom-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Exercise fullscreen chooser and both direct project routes
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/db-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const base='http://127.0.0.1:8765/';
            const tgFragment='#tgWebAppVersion=8.0&tgWebAppPlatform=android&tgWebAppData=demo';
            await page.addInitScript(()=>{
              window.__fullscreenCalls=0;
              const tg={
                isFullscreen:false,
                isVersionAtLeast:()=>true,
                safeAreaInset:{top:24,bottom:0},
                contentSafeAreaInset:{top:66,bottom:0},
                ready(){},expand(){},requestFullscreen(){this.isFullscreen=true;window.__fullscreenCalls++},
                BackButton:{hide(){}},
                HapticFeedback:{impactOccurred(){}},
                onEvent(){},setHeaderColor(){},setBackgroundColor(){}
              };
              Object.defineProperty(window,'Telegram',{value:{WebApp:tg},configurable:true});
            });
            await page.route('**/*',route=>{
              const u=route.request().url();
              if(!u.startsWith(base))return route.abort();
              // Allow local videos: loader state and header animation depend on the first video frame.
              return route.continue();
            });
            const goto=async(url)=>page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await goto(base+tgFragment);
            const home=await page.evaluate(()=>({
              title:document.title,
              count:document.querySelectorAll('.project[data-project]').length,
              noIframe:!document.querySelector('iframe'),
              fullscreenCalls:window.__fullscreenCalls,
              arsenal:!!document.querySelector('.project[data-project="arsenal"]'),
              dashbyte:!!document.querySelector('.project[data-project="dashbyte"]'),
              permvl:!!document.querySelector('.project[data-project="perm-vl"]')
            }));
            console.log('HOME '+JSON.stringify(home));
            if(home.count!==3||!home.noIframe||!home.arsenal||!home.dashbyte||!home.permvl||home.fullscreenCalls<1)throw Error('Chooser unavailable or Telegram fullscreen missing');
            await page.locator('.project[data-project="arsenal"]').click({timeout:16000});
            await page.waitForURL(/\/arsenal\.html#tgWebAppVersion/,{timeout:25000});
            await page.locator('.site-header').waitFor({state:'attached',timeout:25000});
            const ars=await page.evaluate(()=>({
              top:getComputedStyle(document.querySelector('.site-header')).top,
              returnLink:!!document.getElementById('db-arsenal-chooser-link'),
              fullscreenCalls:window.__fullscreenCalls,
              title:document.title
            }));
            console.log('ARSENAL '+JSON.stringify(ars));
            if(!ars.returnLink||ars.fullscreenCalls<1||parseFloat(ars.top)<70||parseFloat(ars.top)>116)
              throw Error('Arsenal glass header or return navigation broken: '+JSON.stringify(ars));
            await page.locator('#db-arsenal-chooser-link').evaluate(el=>el.click());
            await page.waitForURL(u=>u.pathname==='/'&&u.hash.includes('tgWebAppVersion'),{timeout:25000});
            await page.locator('.project[data-project="dashbyte"]').click({timeout:16000});
            await page.waitForURL(u=>u.pathname.endsWith('/dashbyte.html')&&u.hash.includes('tgWebAppVersion')&&u.searchParams.has('fresh'),{timeout:60000});
            await page.locator('#topbar').waitFor({state:'attached',timeout:60000});
            await page.waitForTimeout(3500);
            const db=await page.evaluate(()=>({
              top:getComputedStyle(document.getElementById('topbar')).top,
              returnLink:!!document.getElementById('db-chooser-return'),
              direct:document.documentElement.classList.contains('db-direct-showroom'),
              telegramSdkIncluded:!!document.querySelector('script[src*="telegram-web-app.js"]'),
              fullscreenCalls:window.__fullscreenCalls,
              video:!!document.getElementById('db-mobile-hero-video'),
              title:document.title
            }));
            console.log('DASHBYTE '+JSON.stringify(db));
            const inspect=async(phase)=>page.evaluate(phase=>{
              const el=document.getElementById('topbar'),cs=getComputedStyle(el),b=el.getBoundingClientRect();
              const ancestry=[];let p=el.parentElement;
              while(p&&ancestry.length<8){
                const v=getComputedStyle(p),q=p.getBoundingClientRect();
                ancestry.push({tag:p.tagName,id:p.id,cls:String(p.className||'').slice(0,90),transform:v.transform,translate:v.translate,perspective:v.perspective,filter:v.filter,contain:v.contain,rectTop:Math.round(q.top)});
                p=p.parentElement;
              }
              return {phase,scrollY:scrollY,visible:document.documentElement.classList.contains('db-header-visible'),bodyClass:document.body.className,rootClass:document.documentElement.className,top:cs.top,position:cs.position,transform:cs.transform,translate:cs.translate,animation:cs.animation,transition:cs.transition,opacity:cs.opacity,visibility:cs.visibility,rect:{top:b.top,bottom:b.bottom,height:b.height,left:b.left},inline:{top:el.style.top,transform:el.style.transform},ancestry};
            },phase);
            const initial=await inspect('initial');
            console.log('DB_DIAG '+JSON.stringify(initial));
            await page.evaluate(()=>window.scrollTo(0,1200));
            await page.waitForTimeout(90);
            const moving=await inspect('during-entry');
            console.log('DB_DIAG '+JSON.stringify(moving));
            await page.waitForTimeout(900);
            const shown=await inspect('shown');
            console.log('DB_DIAG '+JSON.stringify(shown));
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(70);
            const leaving=await inspect('during-exit');
            console.log('DB_DIAG '+JSON.stringify(leaving));
            // No vertical shift at any time: the visibility transition only
            // fades in/out, never enters the native Telegram control strip.
            for(const state of [initial,moving,shown,leaving]){
              const y=state.rect.top,css=parseFloat(state.top);
              if(!(Number.isFinite(y)&&y>=76&&y<=160&&Math.abs(y-css)<2&&state.translate==='none'&&
                   !state.transition.includes('translate')))
                throw Error('DB glass header overlaps Telegram or moves vertically: '+JSON.stringify(state));
            }
            if(!shown.visible||shown.opacity!=='1')throw Error('DB header did not reveal after scroll');

            if(!db.returnLink||!db.direct||!db.telegramSdkIncluded||!db.video||db.fullscreenCalls<1||parseFloat(db.top)<76||parseFloat(db.top)>160)
              throw Error('DashByte full release/menu failed: '+JSON.stringify(db));
            // The two motion reels must already be preparing media BEFORE
            // they come on screen. Neither should depend on a first scroll.
            await page.waitForTimeout(1600);
            const prepared=await page.evaluate(()=>{
              return ['db-archive-video','db-reel-second-video'].map(id=>{
                const v=document.getElementById(id);
                return {id,src:v?.currentSrc||v?.src||'',preload:v?.preload,
                  muted:v?.muted,readyState:v?.readyState,networkState:v?.networkState};
              });
            });
            console.log('REELS_PREPARED '+JSON.stringify(prepared));
            if(prepared.length!==2||
               !prepared[0].src.includes('showreel-original.mp4')||
               !prepared[1].src.includes('hero-mobile.mp4')||
               prepared.some(v=>v.preload!=='auto'||!v.muted)){
              throw Error('DashByte reels did not start prebuffering before scroll: '+JSON.stringify(prepared));
            }

            await page.locator('#db-chooser-return').evaluate(el=>el.click());
            await page.waitForURL(u=>u.pathname==='/'&&u.hash.includes('tgWebAppVersion'),{timeout:30000});
            // Reproduce the real Telegram Android race: WebApp SDK is not
            // available yet when the inline head script runs, then arrives later.
            const late=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await late.route('**/*',route=>{
              const u=route.request().url();
              if(u.startsWith(base))return route.continue();
              return route.abort();
            });
            await late.goto(base+'dashbyte.html?late-sdk='+Date.now()+tgFragment,{waitUntil:'domcontentloaded',timeout:90000});
            const before=await late.evaluate(()=>({
              top:document.getElementById('topbar').getBoundingClientRect().top,
              css:getComputedStyle(document.getElementById('topbar')).top,
              sdkinitial:!!window.Telegram?.WebApp
            }));
            console.log('LATE_TG_BEFORE '+JSON.stringify(before));
            if(before.sdkinitial||before.top<76)throw Error('Mobile fallback overlaps native controls before SDK loads');
            await late.evaluate(()=>{
              window.Telegram={WebApp:{
                isFullscreen:true,isVersionAtLeast:()=>true,
                safeAreaInset:{top:24},contentSafeAreaInset:{top:66},
                ready(){},expand(){},requestFullscreen(){},onEvent(){},BackButton:{hide(){}}
              }};
              window.dispatchEvent(new Event('load'));
            });
            await late.waitForTimeout(900);
            const after=await late.evaluate(()=>({
              top:document.getElementById('topbar').getBoundingClientRect().top,
              variable:document.documentElement.style.getPropertyValue('--db-native-header-top')
            }));
            console.log('LATE_TG_AFTER '+JSON.stringify(after));
            if(after.top<76||after.top>150)throw Error('Late Telegram SDK header offset not corrected');
            await late.close();
            // Desktop UX: three live projects fully visible without scrolling;
            // the studio introduction is the next screen, with a narrow gateway.
            const desktop=await browser.newPage({viewport:{width:1536,height:864}});
            await desktop.route('**/*',route=>{
              const u=route.request().url();
              return u.startsWith(base)?route.continue():route.abort();
            });
            await desktop.goto(base,{waitUntil:'domcontentloaded',timeout:90000});
            for(const [width,height] of [[1536,864],[1280,720],[1920,1080]]){
              await desktop.setViewportSize({width,height});
              await desktop.waitForTimeout(650);
              const ui=await desktop.evaluate(()=>{
                const rect=el=>{const r=el.getBoundingClientRect();
                  return {top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
                return {
                  cards:Array.from(document.querySelectorAll('.page > .projects > a.project')).map(rect),
                  stage:rect(document.querySelector('.studio-stage')),
                  portal:rect(document.querySelector('.studio-portal')),
                  video:document.getElementById('showroom-film')?.getAttribute('src')||'',
                  viewport:{width:innerWidth,height:innerHeight}
                };
              });
              console.log('DESKTOP_COVER '+JSON.stringify(ui));
              if(ui.cards.length!==3||ui.cards.some(c=>c.top<0||c.bottom>height-8||c.width>370||c.height>260)||
                 ui.stage.top<height-8||ui.portal.width>430||!ui.video.includes('hero-desktop.mp4')){
                throw Error('Desktop overview must fit all three project cards above fold: '+JSON.stringify(ui));
              }
            }
            await desktop.close();
            console.log('PASS: selection -> Arsenal -> selection -> DashByte -> selection + desktop card deck');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
