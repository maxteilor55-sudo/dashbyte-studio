name: Verify Arsenal Telegram delivery separation
on:
  push:
    branches:
      - main
    paths:
      - 'bot/worker.js'
      - 'bot/test.mjs'
      - '.github/workflows/verify-arsenal-leads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bot/worker.js
      - run: node --test bot/test.mjs
