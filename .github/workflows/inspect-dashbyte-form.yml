name: Inspect DashByte contact form markers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-dashbyte-form.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show bounded form markup and handlers from approved source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          source=subprocess.check_output(['git','show','57f21d6bb23c4f446da95a2819a5beade1ffa6df:index.html']).decode('utf-8')
          terms=['Подготовить сообщение','БРИФ ЗА МИНУТУ','Демо-форма','brief-form','briefForm','brief','Ваш контакт','Как обращаться','<form','</form>']
          print('Total source characters:',len(source))
          for t in terms:
            matches=list(re.finditer(re.escape(t),source,re.I))
            print('\nTERM',repr(t),'COUNT',len(matches))
            for m in matches[:3]:
              print('LOCATION',m.start())
              print(source[max(0,m.start()-1100):min(len(source),m.end()+2000)].replace('\x00',''))
          PY
