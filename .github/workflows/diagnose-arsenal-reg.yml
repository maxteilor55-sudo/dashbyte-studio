name: Diagnostic Arsenal REG.RU website before DNS switchover
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-arsenal-reg.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test hosted Arsenal without changing public DNS
        shell: bash
        run: |
          set +e
          echo '== HTTP HEADERS ON TARGET SERVER =='
          curl -sS --max-time 15 --connect-timeout 8 --resolve navesy59.ru:80:31.31.196.248 -D /tmp/httpheaders -o /tmp/arsenal_html http://navesy59.ru/
          echo "HTTP_RESULT=$?"
          head -n 15 /tmp/httpheaders
          echo "HTML_SIZE=$(wc -c < /tmp/arsenal_html)"
          echo '== EXPECTED CONTENT =='
          grep -o -i -m2 -E 'АРСЕНАЛ|Arsenal|DashByte' /tmp/arsenal_html | head -n 8
          echo '== STATIC ASSETS HEADERS =='
          curl -sS --max-time 15 --connect-timeout 8 --resolve navesy59.ru:80:31.31.196.248 -I http://navesy59.ru/assets/db-glass-up.js | head -n 14
          echo '== HTTPS TARGET DIAGNOSTIC =='
          curl -ksS --max-time 15 --connect-timeout 8 --resolve navesy59.ru:443:31.31.196.248 -D /tmp/httpsheaders -o /tmp/arsenal_tls_html https://navesy59.ru/
          echo "HTTPS_RESULT=$?"
          head -n 15 /tmp/httpsheaders
          if test -f /tmp/arsenal_tls_html; then echo "HTTPS_HTML_SIZE=$(wc -c < /tmp/arsenal_tls_html)"; fi
          echo '== HTTPS CERTIFICATE VALIDITY =='
          curl -sS --max-time 15 --connect-timeout 8 --resolve navesy59.ru:443:31.31.196.248 -o /dev/null https://navesy59.ru/
          echo "HTTPS_CERT_RESULT=$?"

          echo '== PUBLIC DNS FROM GOOGLE/CF/OS =='
          dig +short navesy59.ru A @8.8.8.8
          dig +short navesy59.ru A @1.1.1.1
          dig +short navesy59.ru AAAA @8.8.8.8
          dig +short www.navesy59.ru A @8.8.8.8
          echo '== PUBLIC HTTPS =='
          curl -sSvL --connect-timeout 8 --max-time 15 -o /dev/null -w 'PUBLIC_HTTPS_STATUS=%{http_code} IP=%{remote_ip} EFFECTIVE=%{url_effective}\n' https://navesy59.ru/ 2>&1 | tail -n 19
          echo '== PUBLIC HTTP REDIRECT =='
          curl -sSIL --connect-timeout 8 --max-time 15 -o /dev/null -w 'HTTP_STATUS=%{http_code} IP=%{remote_ip} EFFECTIVE=%{url_effective}\n' http://navesy59.ru/
          echo '== FORCED NEW SERVER TRUST CHECK =='
          curl -sSIL --connect-timeout 8 --max-time 15 --resolve navesy59.ru:443:31.31.196.248 -o /dev/null -w 'FORCED_HTTPS_STATUS=%{http_code} IP=%{remote_ip} EFFECTIVE=%{url_effective}\n' https://navesy59.ru/
          echo '== TARGET SSL CERTIFICATE INFO =='
          echo | openssl s_client -connect 31.31.196.248:443 -servername navesy59.ru 2>/dev/null | openssl x509 -noout -subject -issuer -dates

          echo '== FAVICON FILE RESPONSE FROM REG.RU =='
          curl -sSIL --connect-timeout 6 --max-time 12 https://navesy59.ru/favicon.ico | head -n 22
          echo '== FAVICON AND HEAD MARKUP IN LIVE ARSENAL =='
          python3 - <<'PY'
          from urllib.request import urlopen
          from html.parser import HTMLParser
          class Parser(HTMLParser):
            def __init__(self): super().__init__();self.tags=[]
            def handle_starttag(self,t,attrs):
              if t in ['link','meta'] and any(k in ['rel','name','property'] and any(x in str(v).lower() for x in ['icon','manifest','theme','og:image']) for k,v in attrs):
                self.tags.append((t,attrs))
          for target in ['https://navesy59.ru/','https://navesy59.ru/favicon.ico']:
            try:
              resp=urlopen(target, timeout=15)
              data=resp.read()
              print('LIVE_RESOURCE',target,'status',resp.status,'bytes',len(data),'type',resp.headers.get('Content-Type'),'head',data[:20])
              if 'favicon.ico' not in target:
                p=Parser();p.feed(data[:120000].decode('utf-8','replace'));print('HEAD_LINKS',p.tags[:20])
            except Exception as ex: print('RESOURCE_ERROR',target,type(ex).__name__,str(ex)[:240])
          PY
