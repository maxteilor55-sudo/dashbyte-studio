name: Build downloadable Arsenal offline HTML preview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-arsenal-offline-preview.py'
      - '.github/workflows/build-arsenal-offline-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arsenal-offline-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare preview with all assets embedded
        run: |
          python3 -m pip install --quiet --break-system-packages pillow cairosvg
          python3 scripts/package-arsenal.py
          python3 scripts/build-arsenal-offline-preview.py
      - name: Verify standalone preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arsenal-preview.html')
          h=p.read_text(encoding='utf-8')
          assert p.stat().st_size>500_000
          assert 'data:image/' in h
          assert 'lestnicy.html' in h
          assert 'garazhi.html' in h
          assert '#contacts' in h
          assert '"navesy.html"' in h
          assert 'Локальный предпросмотр' in h
          print('OFFLINE_PREVIEW_VALIDATED',p.stat().st_size)
          PY
      - name: Commit a single downloadable HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/package-arsenal.py
            python3 scripts/build-arsenal-offline-preview.py
            git add arsenal-preview.html
            if git diff --cached --quiet; then
              echo "Latest HTML preview already present."
              exit 0
            fi
            git commit -m "build: refresh offline Arsenal preview HTML"
            if git push origin HEAD:main; then
              echo "Preview HTML committed."
              exit 0
            fi
          done
          echo "Could not publish preview HTML after retries"
          exit 1
