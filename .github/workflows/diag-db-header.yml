name: Diagnose DashByte header animation and CSS origin
on:
  push:
    branches: [main]
    paths: [.github/workflows/diag-db-header.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace exact header selectors, animation rules and scroll handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('dashbyte.html').read_text('utf-8')
          print('SOURCE_LENGTH',len(s))
          for needle in ['#topbar','db-header-visible','db-entry-wait','.topbar','translate:','translateY(','headerVisible','headerTop','scrollY>','scrollY <','scrollY>','--db-native-header-top','transition:translate','revealHeader','menu-sheet','motion-enabled']:
            matches=list(re.finditer(re.escape(needle),s))
            print('\n===',repr(needle),'TOTAL',len(matches))
            for m in matches[:16]:
              left=max(0,m.start()-250);right=min(len(s),m.end()+470)
              print('MATCH POS',m.start(),repr(s[left:right].replace('\n',' '))[:850])
          for ident in ['db-archive-reel-control','db-reel-media-control','db-film-controller']:
            start=s.find('<script id="'+ident+'"')
            if start>=0:
              end=s.find('</script>',start)
              print('FULL_VIDEO_CONTROLLER',ident,s[start:min(end+9,start+10500)])
          key="function secondAttach()"
          st=s.find(key)
          if st>=0:print('SECOND_CONTROLLER_EXCERPT',s[st:st+2200])
          print('\n----- VIDEOS AND MEDIA PLAYER CONTROLLERS -----')
          for m in list(re.finditer(r'<video\b[^>]*>',s,re.I|re.S))[:35]:
            tag=m.group(0)
            print('VIDEO',m.start(),re.sub(r'\s+',' ',tag)[:850])
            nearby=s[m.start():m.start()+1400]
            for src in re.findall(r'<source\b[^>]*>',nearby,re.I|re.S)[:3]:
              print('  SOURCE',re.sub(r'\s+',' ',src)[:340])
          for needle in ['data-src','preload="none"',"preload='none'",'preload="metadata"','preload="auto"','loading="lazy"','lazy-video','.play()','play().catch','IntersectionObserver','db-reel','db-mobile-hero-video','canplay','loadeddata','requestVideoFrameCallback']:
            hits=list(re.finditer(re.escape(needle),s))
            print('\nVIDEO_TERM',repr(needle),'COUNT',len(hits))
            for m in hits[:6]:
              st=max(0,m.start()-280);en=min(len(s),m.end()+540)
              text=s[st:en].replace('\n',' ')
              text=re.sub(r'data:[^" ]{100,}', '[EMBEDDED]',text)
              print('CONTEXT',m.start(),repr(text[:940]))
          PY
