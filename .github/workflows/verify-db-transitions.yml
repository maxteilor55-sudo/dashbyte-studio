name: Verify DashByte liquid page transitions
on:
  push:
    branches: [main]
    paths:
      - index.html
      - arthur.html
      - dashbyte.html
      - arsenal.html
      - green-collection.html
      - perm-vl.html
      - privacy.html
      - arsenal-privacy.html
      - showcase.html
      - showroom.html
      - assets/db-route-transition.js
      - assets/db-route-transition.css
      - scripts/verify-db-transitions.cjs
      - .github/workflows/verify-db-transitions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Exercise blur exits, reverse navigation, and unchanged PIN gate
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/db-routes.log 2>&1 &
          node scripts/verify-db-transitions.cjs
