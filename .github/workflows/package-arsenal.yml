name: Build Arsenal REG.RU deployment ZIP (manual recovery)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-arsenal.yml'
      - 'arsenal.html'
      - 'assets/arsenal-showcase-v1.css'
      - 'assets/arsenal-showcase-v1.js'
      - 'assets/arsenal-glass-nav.css'
      - 'assets/arsenal-glass-nav.js'
      - 'scripts/arsenal-seo.py'
      - 'scripts/package-arsenal.py'
      - 'scripts/upgrade_arsenal.py'
      - 'assets/arsenal-compliance.js'
      - 'assets/arsenal-compliance.css'
      - 'arsenal-privacy.html'
      - 'assets/arsenal-leads-config.js'
      - 'assets/arsenal-leads.js'
      - 'assets/arsenal-leads.css'
  workflow_dispatch:
concurrency:
  group: arsenal-reg-ru-deployment-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install icon rendering libraries
        run: python3 -m pip install --quiet --break-system-packages pillow cairosvg
      - name: Prepare static site files for ispmanager
        run: python3 scripts/package-arsenal.py
      - name: Validate legal data, SEO and archive integrity
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('arsenal-upload.zip')
          assert p.stat().st_size > 750_000
          with ZipFile(p) as z:
              assert z.testzip() is None, 'Corrupted ZIP member'
              files=set(z.namelist())
              services={'navesy.html','garazhi.html','lestnicy.html','ograzhdeniya.html',
                        'terrasy.html','vhodnye-gruppy.html','svarka.html'}
              required={'index.html','arsenal-privacy.html','robots.txt','sitemap.xml',
                        '.htaccess','favicon.ico','apple-touch-icon.png'} | services
              assert required <= files, sorted(required-files)
              home=z.read('index.html').decode('utf-8')
              policy=z.read('arsenal-privacy.html').decode('utf-8')
              robots=z.read('robots.txt').decode('utf-8')
              smap=z.read('sitemap.xml').decode('utf-8')
              assert '<title>Навесы, гаражи' in home
              assert home.count('application/ld+json') >= 1
              assert 'ООО «ТД АРСЕНАЛ»' in policy and '2863637@gmail.com' in policy
              assert 'Перед утверждением окончательной редакции' not in policy
              assert 'https://navesy59.ru/sitemap.xml' in robots
              config=z.read('assets/arsenal-leads-config.js').decode('utf-8')
              assert 'https://dashbyte-studio-bot.maxteilor55.workers.dev/api/arsenal-lead' in config
              assert '0x4AAAAAAF1BuI0o7tkWo3mA' in config
              # REG.RU now embeds the complete app, not an external script.
              assert 'id="arsenal-leads-inline-app"' in home
              assert 'id="arsenal-leads-inline-styles"' in home
              assert 'applicationText=' not in home
              assert 'Сформировать заявку' not in home
              assert 'Демонстрационный режим' not in home
              assert 'Отправить заявку' in home
              assert 'Заявка передана в Telegram!' in home
              assert 'window.ARSENAL_TURNSTILE_SITEKEY' in home
              consent=z.read('assets/arsenal-compliance.js').decode('utf-8')
              assert 'arsenal-compliance.js?v=20261107x' in home
              assert '109304299' in consent and 'arsenal-cookie-choice-v3' in consent
              assert "'arsenal_lead_delivered'" in consent
              assert "if(choice==='accepted')enableAnalytics()" in consent
              assert 'webvisor:true' in consent
              assert 'ym-disable-keys' in consent
              assert "yes.textContent='Разрешить аналитику'" in consent
              assert 'Разрешить аналитику и Вебвизор' not in consent
              assert 'Вебвизор (записи взаимодействий' in policy
              assert 'arsenal-cookie-choice-v3' in policy
              assert 'window.arsenalReportLeadSuccess?.();' in home
              # Only the provisional UI is removed, never real functionality.
              assert 'ars-showcase__demo' not in home
              assert 'id="arsenal-gallery-20261107"' in home
              assert 'id="arsenal-services-grid-2up-20261107"' in home
              assert 'data-arsenal-grid="2up-r2"' in home
              assert 'grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important' in home
              assert home.count('style="grid-column:auto!important;min-width:0!important"') == 11
              assert 'name="arsenal-release" content="services-2up-captions-20261107-r2"' in home
              assert 'Пермский край, д. Ежи' in z.read('garazhi.html').decode('utf-8')
              assert 'class="panel service-gallery"' in z.read('svarka.html').decode('utf-8')
              assert '#services .service-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important' in home
              assert '#services .service-grid>.service-card.wide{min-height:255px!important' in home
              assert home.count('class="ars-gallery-geo"') == 0
              assert 'id="ars-showcase"' not in home and 'id="projects"' not in home
              assert 'class="ars-seo-card"' not in home
              assert home.count('<a class="service-card') == 11
              assert 'id="services"' in home and 'id="approach"' in home
              assert 'data-dock="approach" href="#approach"' in home
              assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in home
              assert 'Места и годы указаны для примера' not in home
              assert 'Ссылка MAX открывает группу' not in home
              assert 'После подтверждения контактов' not in home
              assert 'ПРОЕКТЫ / ДЕМО' not in home
              assert 'Пермь · пример места' not in home
              assert 'Группа в MAX' in home and 'https://max.ru/join/' in home
              assert 'href="tel:+79082400998"' in home
              assert 'id="contact-form"' in home
              assert 'arsenal-leads-inline-app' in home
              assert 'id="arsenal-shared-ui-critical"' in home
              assert 'id="arsenal-shared-ui-script"' in home
              assert 'db-glass-up.js?v=2' in home
              assert 'brand-mark.db-demo-mark::after' in home
              assert 'content:none!important' in home
              assert 'class="arsenal-mark-a"' in home
              assert 'id="menu-toggle"' in home and 'id="mobile-menu"' in home
              assert 'Оставьте заявку — мы свяжемся с вами.' in home
              showcase=z.read('assets/arsenal-showcase-v1.js').decode('utf-8')
              assert "place:'',year:''," in showcase and "place:'Пермь" not in showcase
              assert "Демонстрационные данные" not in showcase
              assert "Фото для примера" not in showcase
              assert 'Яндекс.Метрика' in policy and '109304299' in policy
              import re, subprocess
              inline=re.search(r'<script id="arsenal-leads-inline-app">([\s\S]*?)</script>',home)
              assert inline, 'Inline production form script not found'
              pathlib=Path('/tmp/arsenal-reg-ru-inline.js')
              pathlib.write_text(inline.group(1),encoding='utf-8')
              subprocess.run(['node','--check',str(pathlib)],check=True)
              subprocess.run(['node','--check','assets/arsenal-compliance.js'],check=True)
              assert 'ARSENAL_CHAT_ID' not in config and 'TELEGRAM_BOT_TOKEN' not in config
              ET.fromstring(smap)
              for f in services:
                  assert './'+f in home, f
                  page=z.read(f).decode('utf-8')
                  assert '<h1>' in page and '<link rel="canonical"' in page
                  assert 'application/ld+json' in page
                  assert 'id="arsenal-shared-ui-critical"' in page
                  assert 'class="ars-legal-footer"' in page and 'ООО «ТД АРСЕНАЛ»' in page
                  assert 'class="arsenal-mark-a"' in page
                  assert 'https://t.me/DashByteStudioBot' in page
                  assert 'id="arsenal-shared-ui-script"' in page
                  assert 'id="arsenal-universal-up-style"' in page
                  assert 'id="arsenal-universal-up-script"' in page
                  assert '#db-glass-up.is-visible{' in page
                  assert "button.classList.toggle('is-visible',y>230)" in page
                  assert 'window.scrollTo({top:0' in page
                  assert 'html body header.site-header .brand-mark.db-demo-mark{' in page
                  assert 'id="menu-toggle"' in page and 'id="mobile-menu"' in page
                  assert 'brand-mark db-demo-mark' in page
                  assert 'id="ars-back-to-top"' not in page
                  assert 'class="ars-service-dock"' in page
                  assert 'href="./#contacts">Написать ↗</a>' in page
                  assert 'href="tel:+79082400998">Позвонить ↗</a>' in page
                  assert 'arsenal-compliance.js?v=20261107x' in page
                  assert 'https://navesy59.ru/'+f in smap
              # Header and mobile menu markup are reused from the homepage.
              # On internal pages only the anchor hrefs differ (./#...).
              def normalized_header(doc):
                  match=re.search(
                      r'(<header class="site-header" id="top">[\s\S]*?</header>[\s\S]*?'
                      r'<div class="mobile-menu site-mobile-flyout" id="mobile-menu">'
                      r'[\s\S]*?)(?=<div aria-hidden="true" class="read-progress">|<div class="wrap">|<div class="shell">)',
                      doc)
                  assert match, 'Missing canonical glass header'
                  nav=match.group(1).strip()
                  nav=nav.replace('href="./#','href="#').replace('href="./"','href="#top"')
                  return nav
              expected_nav=normalized_header(home)
              for filename in sorted(services)+['arsenal-privacy.html']:
                  assert normalized_header(z.read(filename).decode('utf-8'))==expected_nav,filename
              assert 'пароль' not in policy.lower()
              assert 'id="menu-toggle"' in policy and 'id="mobile-menu"' in policy
              # No policy-local nav or brand styles may resize the shared header.
              assert '<nav class="ars-policy-toc"' in policy
              assert '.ars-policy-toc span{' in policy
              assert '.ars-policy-toc a{' in policy
              assert '.nav span{' not in policy and '.nav a{' not in policy
              assert '.brand small{' not in policy
              assert 'class="ars-policy-source-brand"' not in policy
              assert 'id="arsenal-universal-up-style"' in policy
              assert 'id="arsenal-universal-up-script"' in policy
              assert 'id="ars-back-to-top"' not in policy
              assert 'id="arsenal-shared-ui-critical"' in policy
              assert 'id="arsenal-shared-ui-script"' in policy
              assert 'class="ars-legal-footer"' in policy and 'ООО «ТД АРСЕНАЛ»' in policy
              assert 'https://t.me/DashByteStudioBot' in policy
              assert 'assets/arsenal-glass-nav.css' in files
              assert 'assets/arsenal-glass-nav.js' in files
              import subprocess
              subprocess.run(['node','--check','assets/arsenal-glass-nav.js'],check=True)
              # The release must contain independently parseable CSS rules.
              import tinycss2
              css=z.read('assets/arsenal-glass-nav.css').decode('utf-8')
              rules=tinycss2.parse_stylesheet(css,skip_comments=True,skip_whitespace=True)
              top_selectors=[tinycss2.serialize(rule.prelude).strip() for rule in rules
                             if rule.type=='qualified-rule']
              assert '.ars-glass-brand__mark' in top_selectors
              assert 'html body header.site-header .brand-mark.db-demo-mark::after' in top_selectors
              assert '#db-glass-up.is-visible{' in z.read('assets/db-glass-up.css').decode('utf-8')
              subprocess.run(['node','--check','assets/db-glass-up.js'],check=True)
              assert css.count('{')==css.count('}')
              print('ARSENAL_RELEASE_VALIDATED', len(files), p.stat().st_size)
          PY
      - name: Commit downloadable ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other commits can arrive while this job renders the ZIP.
          # Rebuild from the CURRENT main at every retry to avoid rebasing
          # an outdated binary ZIP, which always results in merge conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/package-arsenal.py
            git add arsenal-upload.zip
            if git diff --cached --quiet; then
              echo "Archive already matches main."
              exit 0
            fi
            git commit -m "build: refresh Arsenal standalone hosting archive"
            if git push origin HEAD:main; then
              echo "Archive published."
              exit 0
            fi
            echo "Concurrent update: rebuilding archive from latest main (attempt $attempt)."
          done
          echo "Could not publish archive after 5 attempts."
          exit 1
