name: Build Arsenal REG.RU deployment ZIP (manual recovery)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-arsenal.yml'
      - 'scripts/arsenal-seo.py'
      - 'scripts/package-arsenal.py'
      - 'arsenal-privacy.html'
      - 'assets/arsenal-leads-config.js'
      - 'assets/arsenal-leads.js'
      - 'assets/arsenal-leads.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install icon rendering libraries
        run: python3 -m pip install --quiet --break-system-packages pillow cairosvg
      - name: Prepare static site files for ispmanager
        run: python3 scripts/package-arsenal.py
      - name: Validate legal data, SEO and archive integrity
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('arsenal-upload.zip')
          assert p.stat().st_size > 3_000_000
          with ZipFile(p) as z:
              assert z.testzip() is None, 'Corrupted ZIP member'
              files=set(z.namelist())
              services={'navesy.html','garazhi.html','lestnicy.html','ograzhdeniya.html',
                        'terrasy.html','vhodnye-gruppy.html','svarka.html'}
              required={'index.html','arsenal-privacy.html','robots.txt','sitemap.xml',
                        '.htaccess','favicon.ico','apple-touch-icon.png'} | services
              assert required <= files, sorted(required-files)
              home=z.read('index.html').decode('utf-8')
              policy=z.read('arsenal-privacy.html').decode('utf-8')
              robots=z.read('robots.txt').decode('utf-8')
              smap=z.read('sitemap.xml').decode('utf-8')
              assert '<title>Навесы, гаражи' in home
              assert home.count('application/ld+json') >= 1
              assert 'ООО «ТД АРСЕНАЛ»' in policy and '2863637@gmail.com' in policy
              assert 'Перед утверждением окончательной редакции' not in policy
              assert 'https://navesy59.ru/sitemap.xml' in robots
              config=z.read('assets/arsenal-leads-config.js').decode('utf-8')
              assert 'https://dashbyte-studio-bot.maxteilor55.workers.dev/api/arsenal-lead' in config
              assert '0x4AAAAAAF1BuIOo7tkWo3mA' in config
              assert 'arsenal-leads.js' in home and 'arsenal-leads-config.js' in home
              assert 'ARSENAL_CHAT_ID' not in config and 'TELEGRAM_BOT_TOKEN' not in config
              ET.fromstring(smap)
              for f in services:
                  assert './'+f in home, f
                  page=z.read(f).decode('utf-8')
                  assert '<h1>' in page and '<link rel="canonical"' in page
                  assert 'application/ld+json' in page
                  assert 'https://navesy59.ru/'+f in smap
              assert 'пароль' not in policy.lower()
              print('ARSENAL_RELEASE_VALIDATED', len(files), p.stat().st_size)
          PY
      - name: Commit downloadable ZIP
        run: |
          git add arsenal-upload.zip
          if git diff --cached --quiet; then
            echo 'Archive already matches current sources.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh Arsenal standalone hosting archive"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
