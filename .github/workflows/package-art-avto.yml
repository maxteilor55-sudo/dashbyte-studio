name: Package ART AVTO REG.RU release
on:
  push:
    branches: [main]
    paths:
      - 'production/art-avto/**'
      - 'scripts/package-art-avto.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete release archive
        run: python scripts/package-art-avto.py
      - name: Commit synced ZIP if changed
        run: |
          if ! git diff --quiet -- art-avto-upload.zip; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add art-avto-upload.zip
            git commit -m "build(art-avto): sync deploy ZIP with approved logo"
            git push origin HEAD:main
          fi
