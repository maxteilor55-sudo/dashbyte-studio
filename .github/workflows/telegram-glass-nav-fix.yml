name: Apply Telegram glass header and cinematic edge polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-glass-nav-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust-glass-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply safe-area positioning and seamless edge blur
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          def once(text, old, new, label):
              n = text.count(old)
              if n == 1:
                  return text.replace(old, new)
              if n == 0 and new in text:
                  return text
              raise RuntimeError(f"Unexpected {label}: old={n}, new={text.count(new)}")
          
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = once(html,
              "--db-tg-menu-top:max(76px,calc(var(--db-tg-content-safe-top,0px) + 12px));",
              "--db-tg-menu-top:max(72px,calc(var(--db-tg-content-safe-top,0px) + 4px));",
              "direct Telegram header")
          html = once(html, "Math.max(148,Math.min(320,px))",
              "Math.max(72,Math.min(320,px))", "showroom clamp")
          old = "var(--db-showroom-menu-top,164px)"
          new = "var(--db-showroom-menu-top,84px)"
          if html.count(old) == 3:
              html = html.replace(old, new)
          elif html.count(new) != 3:
              raise RuntimeError("Unexpected embedded fallback offset")
          fog_css = """<style id="db-cinematic-edge-fog-v2">
          /* Feathered top and bottom viewport blur; no hard horizontal border. */
          .edge-fog{
            position:fixed!important;left:0!important;right:0!important;z-index:50!important;
            pointer-events:none!important;opacity:1!important;transform:none!important;
            background:transparent!important;backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;mask-image:none!important;-webkit-mask-image:none!important;
          }
          .fog-top{top:0!important;bottom:auto!important;height:clamp(128px,18dvh,208px)!important}
          .fog-bottom{bottom:0!important;top:auto!important;height:clamp(112px,15dvh,176px)!important}
          .edge-fog::before{
            content:"";position:absolute;inset:0;pointer-events:none;
            backdrop-filter:blur(13px) saturate(118%);
            -webkit-backdrop-filter:blur(13px) saturate(118%);
            mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.90) 16%,rgba(0,0,0,.64) 40%,rgba(0,0,0,.24) 72%,transparent 100%);
            -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.90) 16%,rgba(0,0,0,.64) 40%,rgba(0,0,0,.24) 72%,transparent 100%);
          }
          .fog-bottom::before{
            mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.88) 16%,rgba(0,0,0,.60) 42%,rgba(0,0,0,.21) 74%,transparent 100%);
            -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.88) 16%,rgba(0,0,0,.60) 42%,rgba(0,0,0,.21) 74%,transparent 100%);
          }
          .edge-fog::after{
            content:"";position:absolute;inset:0;pointer-events:none;
            background:linear-gradient(to bottom,rgba(12,9,13,.18) 0%,rgba(12,9,13,.07) 35%,transparent 100%);
          }
          .fog-bottom::after{
            background:linear-gradient(to top,rgba(12,9,13,.20) 0%,rgba(12,9,13,.08) 38%,transparent 100%);
          }
          @media(max-width:650px){
           .fog-top{height:clamp(116px,17dvh,178px)!important}
           .fog-bottom{height:clamp(105px,15dvh,160px)!important}
          }
          </style>"""
          if 'id="db-cinematic-edge-fog-v2"' not in html:
              html = once(html, "</head><body>", fog_css + "\n</head><body>", "fog style insertion")
          if len(html) < 11000000:
              raise RuntimeError("Unexpected index size; avoiding destructive write")
          index.write_text(html, encoding="utf-8")
          
          show = Path("showroom.html")
          s = show.read_text(encoding="utf-8")
          s = once(s,
              "#overlay:before{background:linear-gradient(to bottom,rgba(9,9,11,.92),rgba(9,9,11,.07))!important}",
              "#overlay:before{height:calc(var(--db-telegram-top) + 18px)!important;background:linear-gradient(to bottom,rgba(9,9,11,.92) 0%,rgba(9,9,11,.79) 30%,rgba(9,9,11,.44) 57%,rgba(9,9,11,.12) 83%,transparent 100%)!important}",
              "native chrome fade")
          s = once(s,
              "Math.max(100,Number.parseFloat(root.style.getPropertyValue('--db-showroom-menu-top'))||118)",
              "Math.max(72,Number.parseFloat(root.style.getPropertyValue('--db-showroom-menu-top'))||84)",
              "nav stabilization")
          if "const headerTop=tg?Math.max(82,Math.min(92,currentSafe-40)):18;" not in s:
              s = once(s,
                  "const headerTop=tg?Math.max(118,currentSafe+24):18;",
                  "const headerTop=tg?Math.max(84,currentSafe-4):18;",
                  "native-safe header position")
          s = s.replace("var(--db-showroom-menu-top,118px)", "var(--db-showroom-menu-top,84px)")
          s = s.replace(
              "    // Screenshot-guided: ~118px on Telegram's CSS viewport keeps the\n    // glass capsule above the hero while clearing the native close controls.\n    // Set it directly on same-origin iframe: its old message handler clamps\n    // all offsets below 148px, causing the menu to remain too low.",
              "    // Position glass directly beneath native controls, using Telegram safe-area metrics.\n    // No oversized fixed offset; the showroom and iframe now share one position.")
          if len(s) < 20000:
              raise RuntimeError("Unexpected showroom size")
          show.write_text(s, encoding="utf-8")
          # v3: align the capsule with native controls on Android WebView.
          # contentSafeAreaInset may exceed the visible Telegram controls; use
          # a bounded control-height compensation, not the full inset.
          s = once(s,
              "const headerTop=tg?Math.max(84,currentSafe-4):18;",
              "const headerTop=tg?Math.max(82,Math.min(92,currentSafe-40)):18;",
              "Telegram nav geometry v3")
          if "--db-showroom-glass-top',(tg?" not in s:
              s = once(s,
              "root.style.setProperty('--db-telegram-top',currentSafe+'px');",
              "root.style.setProperty('--db-telegram-top',currentSafe+'px');\n    root.style.setProperty('--db-showroom-glass-top',(tg?Math.max(82,Math.min(92,currentSafe-40)):18)+'px');",
              "share glass inset with overlay")
          # Keep Telegram's chrome shadow behind the glass menu, ending in a
          # feather before the capsule instead of shading the capsule itself.
          if 'height:var(--db-showroom-glass-top,84px)!important' not in s:
              s = once(s,
              "#overlay[data-project=\"dashbyte\"] #back{display:none!important}",
              """#overlay[data-project="dashbyte"] #back{display:none!important}
          #overlay:before{
            height:var(--db-showroom-glass-top,84px)!important;
            background:linear-gradient(to bottom,rgba(9,9,11,.78) 0%,rgba(9,9,11,.53) 34%,rgba(9,9,11,.16) 72%,transparent 100%)!important;
            -webkit-backdrop-filter:blur(12px) saturate(120%);
            backdrop-filter:blur(12px) saturate(120%);
            -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.88) 42%,rgba(0,0,0,.38) 76%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.88) 42%,rgba(0,0,0,.38) 76%,transparent 100%);
          }""",
              "smooth native Telegram chrome fade")
          show.write_text(s, encoding="utf-8")

          # Parent showroom determines the real header position. Ignore a
          # late safe-area message from the embedded page once it is staged.
          studio = index.read_text(encoding="utf-8")
          studio = once(studio,
              "if(Number.isFinite(px)){",
              "if(Number.isFinite(px) && !root.classList.contains('db-showroom-stage')){",
              "prevent iframe header offset regression")
          fog_v3 = """<style id="db-cinematic-edge-fog-v3">
          /* Soft multistop light falloff; no visible bar, rectangular seam or texture. */
          .edge-fog{
            background:none!important;overflow:hidden!important;
            border:0!important;box-shadow:none!important;
            pointer-events:none!important;
          }
          .fog-top{height:clamp(160px,22dvh,238px)!important}
          .fog-bottom{height:clamp(138px,19dvh,210px)!important}
          .edge-fog::before{
            inset:0!important;
            backdrop-filter:blur(17px) saturate(128%)!important;
            -webkit-backdrop-filter:blur(17px) saturate(128%)!important;
            background:transparent!important;
            -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.96) 0%,rgba(0,0,0,.91) 17%,rgba(0,0,0,.68) 39%,rgba(0,0,0,.36) 63%,rgba(0,0,0,.1) 85%,transparent 100%)!important;
            mask-image:linear-gradient(to bottom,rgba(0,0,0,.96) 0%,rgba(0,0,0,.91) 17%,rgba(0,0,0,.68) 39%,rgba(0,0,0,.36) 63%,rgba(0,0,0,.1) 85%,transparent 100%)!important;
          }
          .fog-bottom::before{
            -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.87) 17%,rgba(0,0,0,.65) 40%,rgba(0,0,0,.34) 64%,rgba(0,0,0,.09) 84%,transparent 100%)!important;
            mask-image:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.87) 17%,rgba(0,0,0,.65) 40%,rgba(0,0,0,.34) 64%,rgba(0,0,0,.09) 84%,transparent 100%)!important;
          }
          .edge-fog::after{
            background:linear-gradient(to bottom,rgba(10,9,13,.14) 0%,rgba(10,9,13,.07) 36%,rgba(10,9,13,.02) 66%,transparent 100%)!important;
          }
          .fog-bottom::after{
            background:linear-gradient(to top,rgba(10,9,13,.17) 0%,rgba(10,9,13,.07) 33%,rgba(10,9,13,.02) 68%,transparent 100%)!important;
          }
          @media(max-width:650px){
            .fog-top{height:clamp(142px,20dvh,202px)!important}
            .fog-bottom{height:clamp(125px,18dvh,183px)!important}
          }
          </style>"""
          if 'id="db-cinematic-edge-fog-v3"' not in studio:
              studio = once(studio,"</head><body>",fog_v3+"\n</head><body>","edge fog v3 insertion")
          if len(studio)<11000000:
              raise RuntimeError("Unexpected index size after visual update")
          index.write_text(studio, encoding="utf-8")
          # v4: screenshot-calibrated capsule geometry and one-pass fog rendering.
          # The prior 82-92px iframe inset visually leaves ~80px below the
          # native Telegram buttons; use 47-54px inside the embedded viewport.
          s = once(s,
              "const headerTop=tg?Math.max(82,Math.min(92,currentSafe-40)):18;",
              "const headerTop=tg?Math.max(47,Math.min(54,currentSafe-30)):18;",
              "screenshot-aligned compact Telegram header")
          s = once(s,
              "root.style.setProperty('--db-showroom-glass-top',(tg?Math.max(82,Math.min(92,currentSafe-40)):18)+'px');",
              "root.style.setProperty('--db-showroom-glass-top',(tg?Math.max(47,Math.min(54,currentSafe-30)):18)+'px');",
              "screenshot-aligned Telegram gradient")
          # Avoid an inconsistent minimum in the stabilizer when the inset is 47px.
          s = once(s,
              "const top=Math.max(72,Number.parseFloat(root.style.getPropertyValue('--db-showroom-menu-top'))||84);",
              "const top=Math.max(44,Number.parseFloat(root.style.getPropertyValue('--db-showroom-menu-top'))||50);",
              "remove old nav height floor")
          show.write_text(s, encoding="utf-8")
          studio = index.read_text(encoding="utf-8")
          # Remove the *two* inherited fog overrides rather than stacking a third.
          # Original selectors remain as a fallback; the single final layer
          # below owns fog paint, blur and masking in one compositing surface.
          import re
          for old_id in ("db-cinematic-edge-fog-v2","db-cinematic-edge-fog-v3"):
              studio, removed=re.subn(r'<style id="'+old_id+r'">.*?</style>\\s*','',studio,count=1,flags=re.S)
              if removed != 1:
                  raise RuntimeError("Cannot safely deduplicate "+old_id)
          single_fog = """<style id="db-telegram-edge-fog-v4">
          /* One backdrop per edge; matching mask on that same element, no seams.
             Stop rendering legacy blurred pseudo layers entirely. */
          .edge-fog{
            position:fixed!important;left:0!important;right:0!important;
            z-index:50!important;opacity:1!important;transform:none!important;
            border:0!important;box-shadow:none!important;pointer-events:none!important;
            overflow:visible!important;
            backdrop-filter:blur(15px) saturate(116%)!important;
            -webkit-backdrop-filter:blur(15px) saturate(116%)!important;
          }
          .edge-fog::before,.edge-fog::after{
            content:none!important;display:none!important;backdrop-filter:none!important;
            -webkit-backdrop-filter:none!important;
          }
          .fog-top{
            top:0!important;bottom:auto!important;height:clamp(126px,17dvh,185px)!important;
            background:linear-gradient(to bottom,rgba(13,11,15,.14) 0%,rgba(13,11,15,.04) 49%,transparent 100%)!important;
            mask-image:linear-gradient(to bottom,rgba(0,0,0,.93) 0%,rgba(0,0,0,.78) 22%,rgba(0,0,0,.47) 51%,rgba(0,0,0,.19) 76%,transparent 100%)!important;
            -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.93) 0%,rgba(0,0,0,.78) 22%,rgba(0,0,0,.47) 51%,rgba(0,0,0,.19) 76%,transparent 100%)!important;
          }
          .fog-bottom{
            bottom:0!important;top:auto!important;height:clamp(115px,15dvh,170px)!important;
            background:linear-gradient(to top,rgba(13,11,15,.10) 0%,rgba(13,11,15,.035) 44%,transparent 100%)!important;
            mask-image:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.75) 21%,rgba(0,0,0,.41) 52%,rgba(0,0,0,.13) 77%,transparent 100%)!important;
            -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.75) 21%,rgba(0,0,0,.41) 52%,rgba(0,0,0,.13) 77%,transparent 100%)!important;
          }
          @media(max-width:650px){
            .fog-top{height:clamp(120px,16dvh,165px)!important}
            .fog-bottom{height:clamp(102px,13dvh,145px)!important}
          }
          </style>"""
          if 'id="db-telegram-edge-fog-v4"' not in studio:
              studio=once(studio,"</head><body>",single_fog+"\n</head><body>","single-composite edge fade")
          if len(studio)<11000000:
              raise RuntimeError("Unexpected studio file size; abort to protect media")
          index.write_text(studio,encoding="utf-8")
          # Verify there is only one final fog implementation.
          assert studio.count('id="db-telegram-edge-fog-v4"')==1
          assert 'id="db-cinematic-edge-fog-v2"' not in studio
          assert 'id="db-cinematic-edge-fog-v3"' not in studio
          assert "const headerTop=tg?Math.max(47,Math.min(54,currentSafe-30)):18;" in s
          print("V4: compact Telegram header + single seamless edge-fog, verified.")

          # Restricted diagnostic excerpts; never print inline images or media.
          import re
          for needle in (".edge-fog", ".fog-bottom", ".fog-top", "#topbar", "--db-tg-menu-top", "db-header-visible"):
              matches=list(re.finditer(re.escape(needle),studio))
              print("DB-CSS-DIAG",repr(needle),"count",len(matches))
              for m in matches[:5]:
                  snippet=studio[max(0,m.start()-110):m.start()+370].replace("\n"," ")
                  print("DB-CSS-DIAG-SNIP",snippet)
          
          print("Validated and updated both files; preserving all inline media.")
          PY
      - name: Publish both pages atomically
        shell: bash
        run: |
          git diff --check
          git add index.html showroom.html
          if git diff --cached --quiet; then
            echo "Already up-to-date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align Telegram glass menu and feather screen edges"
          git push origin HEAD:main
