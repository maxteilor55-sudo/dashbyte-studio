name: Publish DashByte project showroom
on:
  push:
    branches: [main]
    paths:
      - showroom.html
      - perm-vl.html
      - scripts/build-showroom.py
      - .github/workflows/publish-showroom.yml
  workflow_dispatch:
concurrency:
  group: dashbyte-showroom-builder-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Build approved DashByte release and new home screen
        run: python3 scripts/build-showroom.py
      - name: Validate required routes and media
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          chooser=(root/'index.html').read_text()
          studio=(root/'dashbyte.html').read_text()
          arsenal=(root/'arsenal.html').read_text()
          assert chooser == (root/'showroom.html').read_text()
          assert len(chooser)>9000
          assert 'href="./arsenal.html"' in chooser
          assert 'href="./dashbyte.html?' in chooser
          assert len(studio)>9000000
          assert 'db-direct-showroom-start' in studio
          assert 'id="topbar"' in studio
          assert len(arsenal)>1000000
          assert 'db-arsenal-choice-return-init' in arsenal
          assert '<iframe' not in chooser
          # Every active document loads exactly one unified control; the
          # previous footer-up implementations must not be reintroduced.
          for name in ['index.html','showroom.html','arsenal.html','dashbyte.html','green-collection.html','showcase.html']:
              page=(root/name).read_text(encoding='utf-8')
              assert page.count('assets/db-glass-up.js?v=1')==1, name
              assert page.count('assets/db-glass-up.css?v=1')==1, name
          assert (root/'assets/db-glass-up.js').exists()
          assert (root/'assets/db-glass-up.css').exists()
          assert 'db-chooser-footer-up-controller' not in chooser
          assert 'db-arsenal-footer-up' not in arsenal
          green=(root/'green-collection.html').read_text(encoding='utf-8')
          assert 'gc-back-to-top-controller' not in green
          assert 'gc-footer-up' not in green
          assert 'ПРОЕКТЫ<br><em>В РАЗРАБОТКЕ.</em>' in chooser
          for project, percent in [('arsenal',95),('green-collection',56),('perm-vl',10)]:
              assert f'data-progress="{percent}"' in chooser,project
          assert 'href="./perm-vl.html"' in chooser
          game_page=(root/'perm-vl.html').read_text(encoding='utf-8')
          assert 'id="gameFrame"' in game_page
          assert 'id="downloadHtml"' in game_page
          assert 'https://maxteilor55-sudo.github.io/perm-vl-alpha/' in game_page
          for p in ['assets/hero-mobile.mp4','assets/hero-desktop.mp4','assets/showreel-original.mp4']:
              assert (root/p).exists(),p
          print('Both complete sites verified, canonical studio media intact.')
          PY
      - name: Commit new showroom without touching bot settings
        run: |
          git diff --check
          git add index.html showroom.html dashbyte.html arsenal.html showcase.html DashByte_Showroom_v2_0.html
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: publish cinematic Arsenal + DashByte showroom with standalone glass menus"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
