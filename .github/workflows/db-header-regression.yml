name: Check DashByte header in a simulated Telegram mobile viewport
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/db-header-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Compare DB header geometry to Telegram-safe header position
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/db-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.addInitScript(()=>{
              const tg={
                isFullscreen:true,isVersionAtLeast:()=>true,
                safeAreaInset:{top:24,bottom:0},contentSafeAreaInset:{top:66,bottom:0},
                ready(){},expand(){},requestFullscreen(){},setHeaderColor(){},setBackgroundColor(){},
                onEvent(){},BackButton:{hide(){}},HapticFeedback:{impactOccurred(){}}
              };
              Object.defineProperty(window,'Telegram',{value:{WebApp:tg},configurable:true});
            });
            await page.goto('http://127.0.0.1:8765/showroom.html#dashbyte',{waitUntil:'domcontentloaded',timeout:40000});
            const inner=page.frameLocator('#project');
            await inner.locator('#topbar').waitFor({state:'attached',timeout:40000});
            await inner.locator('body').evaluate(()=>window.scrollTo(0,900));
            await page.waitForTimeout(1200);
            const data=await page.evaluate(()=>{
              const iframe=document.getElementById('project');
              const doc=iframe.contentDocument;
              const bar=doc?.getElementById('topbar');
              const b=bar?.getBoundingClientRect();
              const f=iframe.getBoundingClientRect();
              return {
                frameTop:f.top,headerTopScreen:f.top+b.top,
                headerTopLocal:b.top,headerStyleTop:bar.style.top,
                headerTransform:bar.style.transform,headerOpacity:getComputedStyle(bar).opacity,
                scrollY:iframe.contentWindow.scrollY,
                parentSafe:getComputedStyle(document.documentElement).getPropertyValue('--db-telegram-top'),
                headerHeight:b.height
              };
            });
            console.log('SCREEN_GEOMETRY='+JSON.stringify(data));
            if(!(data.headerTopScreen>=40&&data.headerTopScreen<=102&&data.headerHeight>50))
              throw Error('Header not anchored near native Telegram controls: '+JSON.stringify(data));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
