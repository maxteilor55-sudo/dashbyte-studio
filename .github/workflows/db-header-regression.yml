name: Check DashByte header in a simulated Telegram mobile viewport
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/db-header-regression.yml
      - showroom.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Compare DB header geometry to Telegram-safe header position
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/db-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({
              headless:true,executablePath:'/usr/bin/google-chrome',
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const base='http://127.0.0.1:8765/dashbyte.html';
            const mobile=await browser.newPage({
              viewport:{width:390,height:844},deviceScaleFactor:2,
              isMobile:true,hasTouch:true
            });
            await mobile.addInitScript(()=>{
              const tg={
                isFullscreen:true,isVersionAtLeast:()=>true,
                safeAreaInset:{top:24,bottom:0},contentSafeAreaInset:{top:66,bottom:0},
                ready(){},expand(){},requestFullscreen(){},setHeaderColor(){},setBackgroundColor(){},
                onEvent(){},BackButton:{hide(){}},HapticFeedback:{impactOccurred(){}}
              };
              Object.defineProperty(window,'Telegram',{value:{WebApp:tg},configurable:true});
            });
            const allowLocal=page=>page.route('**/*',route=>
              route.request().url().startsWith('http://127.0.0.1:8765/')?
                route.continue():route.abort()
            );
            await allowLocal(mobile);
            await mobile.goto(base+'#tgWebAppVersion=8.0&tgWebAppPlatform=android',{
              waitUntil:'domcontentloaded',timeout:90000
            });
            await mobile.locator('#topbar').waitFor({state:'attached',timeout:30000});
            await mobile.locator('#db-chooser-return').waitFor({state:'attached',timeout:30000});
            const before=await mobile.locator('#topbar').evaluate(el=>{
              const r=el.getBoundingClientRect();
              return {top:r.top,height:r.height,
                variable:document.documentElement.style.getPropertyValue('--db-native-header-top'),
                noVerticalAnimation:!getComputedStyle(el).transition.includes('translate')}
            });
            await mobile.evaluate(()=>window.scrollTo(0,1000));
            await mobile.waitForTimeout(600);
            const after=await mobile.locator('#topbar').evaluate(el=>el.getBoundingClientRect().top);
            console.log('MOBILE_HEADER',JSON.stringify({before,after}));
            if(!(before.top>=76&&before.top<=105&&before.height>48&&
                 Math.abs(before.top-after)<2&&before.noVerticalAnimation)){
              throw Error('Mobile header does not respect Green Collection safe-area position');
            }
            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await allowLocal(desktop);
            await desktop.goto(base,{waitUntil:'domcontentloaded',timeout:90000});
            await desktop.locator('#topbar').waitFor({state:'attached',timeout:30000});
            const desk=await desktop.locator('#topbar').evaluate(el=>{
              return {top:el.getBoundingClientRect().top,height:el.getBoundingClientRect().height}
            });
            console.log('DESKTOP_HEADER',JSON.stringify(desk));
            if(!(desk.top>=4&&desk.top<=12&&desk.height>48))
              throw Error('Desktop header is not near the viewport top');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
