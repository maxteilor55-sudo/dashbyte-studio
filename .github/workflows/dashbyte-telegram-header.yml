name: DashByte showroom glass menu hotfix
on:
  push:
    paths:
      - 'scripts/fix_showroom_header.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the embedded showroom header
        run: python3 scripts/fix_showroom_header.py
      - name: Validate and save source update
        run: |
          git diff --check
          git add index.html
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep DashByte showroom glass menu below Telegram controls"
          git push origin HEAD:main
