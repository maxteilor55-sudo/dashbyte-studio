name: DBBot opens only latest Arsenal
on:
  push:
    branches: [main]
    paths:
      - showcase.html
      - .github/workflows/arsenal-bot-only.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-arsenal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current Arsenal source and replace all DBBot entrypoints
        shell: bash
        run: |
          python3 - <<'PY'
          import re, json, hashlib, pathlib
          base=pathlib.Path('.')
          showcase=base/'showcase.html'
          text=showcase.read_text(encoding='utf-8')
          # showcase.html owns the currently published Arsenal source in a
          # JSON script. Do not rely on the DashByte website or old copies.
          match=re.search(
              r'<script\b(?=[^>]*\bid=["\']source["\'])(?=[^>]*\btype=["\']application/json["\'])[^>]*>(.*?)</script\s*>',
              text,re.I|re.S)
          if not match:
              raise RuntimeError('Arsenal source was not found; refusing to replace any entrypoints')
          arsenal=json.loads(match.group(1))
          if not isinstance(arsenal,str) or len(arsenal)<100000:
              raise RuntimeError('Incomplete Arsenal source; no changes written')
          if not all(x in arsenal for x in ('site-header','Арсенал','</html>')):
              raise RuntimeError('Source does not appear to be full Arsenal website')
          # Use identical source HTML and add only Telegram mini-app safe-area support
          # for the standalone page (the old showroom used to inject it into an iframe).
          setup=r"""<script src="https://telegram.org/js/telegram-web-app.js"></script>
          <style id="arsenal-telegram-direct">
            html.arsenal-telegram-direct .site-header,
            html.arsenal-telegram-direct .site-header.is-scrolled,
            html.arsenal-telegram-direct .site-header.scrolled {
              top:var(--arsenal-telegram-top,88px)!important;
            }
          </style>
          <script id="arsenal-telegram-direct-init">
          (function(){
            const tg=window.Telegram&&window.Telegram.WebApp;
            if(!tg)return;
            document.documentElement.classList.add('arsenal-telegram-direct');
            function position(){
              const a=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{};
              const safe=Math.max(Number(a.top)||0,Number(c.top)||0);
              const top=Math.max(82,safe+8);
              document.documentElement.style.setProperty('--arsenal-telegram-top',top+'px');
              const header=document.querySelector('.site-header');
              if(header)header.style.setProperty('top',top+'px','important');
              const close=document.querySelector('.viewer>.back,.back-to-projects');
              if(close)close.style.display='none';
            }
            try{
              tg.ready();tg.expand();
              if(tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')&&typeof tg.requestFullscreen==='function'){
                tg.requestFullscreen();
              }
              ['safeAreaChanged','contentSafeAreaChanged','viewportChanged','fullscreenChanged'].forEach(function(e){
                if(tg.onEvent)tg.onEvent(e,position);
              });
              if(tg.BackButton)tg.BackButton.hide();
            }catch(e){}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',position,{once:true});
            else position();
          })();
          </script>"""
          arsenal,n=re.subn(r'</head\s*>',lambda m:setup+'\n'+m.group(0),arsenal,count=1,flags=re.I)
          if n!=1:
              raise RuntimeError('Arsenal HTML has no closing HEAD, aborting')
          digest=hashlib.sha256(arsenal.encode('utf-8')).hexdigest()[:12]
          (base/'arsenal.html').write_text(arsenal,encoding='utf-8')
          url='./arsenal.html?v='+digest
          redirect="""<!doctype html>
          <html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Арсенал — металлоконструкции</title>
          <meta http-equiv="refresh" content="0;url=URL">
          <script>location.replace(new URL('URL',location.href).href)</script>
          </head><body style="background:#14100e;color:#eee;font:16px system-ui">
          <p>Открываем сайт «Арсенал»…</p>
          <a href="URL">Открыть Арсенал</a></body></html>
          """.replace('URL',url)
          # All previously configured BotFather addresses now land on the same
          # exact standalone Arsenal build. Old DashByte files remain in git history.
          for name in ('index.html','showroom.html','DashByte_Showroom_v2_0.html'):
              (base/name).write_text(redirect,encoding='utf-8')
          # BotFather was previously configured to showcase.html too. Keep that
          # file intact as source-of-truth, but redirect its public entry directly.
          script='<script id="db-direct-arsenal-entry">location.replace(new URL('+json.dumps(url)+',location.href).href)</script>'
          if 'id="db-direct-arsenal-entry"' in text:
              text,n=re.subn(r'<script id="db-direct-arsenal-entry">.*?</script>',lambda m:script,text,count=1,flags=re.S)
          else:
              text,n=re.subn(r'<head\b[^>]*>',lambda m:m.group(0)+script,text,count=1,flags=re.I)
          if n!=1:
              raise RuntimeError('Could not safely create showcase redirect')
          showcase.write_text(text,encoding='utf-8')
          assert 'data-project' not in (base/'showroom.html').read_text()
          assert 'Все проекты' not in (base/'index.html').read_text()
          print('DBBot: Arsenal-only entrypoints; source bytes:',len(arsenal),'revision:',digest)
          PY
      - name: Commit all routes and original standalone Arsenal together
        shell: bash
        run: |
          git diff --check
          git add arsenal.html showcase.html index.html showroom.html DashByte_Showroom_v2_0.html
          if git diff --cached --quiet; then
            echo "Arsenal-only bot is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: open latest Arsenal directly in DBBot without project selection"
          git push origin HEAD:main
